- type: antag
  id: SpaceNinja
  name: roles-antag-space-ninja-name
  antagonist: true
  setPreference: true
  objective: roles-antag-space-ninja-objective
  guides: [ SpaceNinja ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 10h
  - !type:DepartmentTimeRequirement
    department: Security
    time: 5h
  - !type:DepartmentTimeRequirement
    department: Science
    time: 5h
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
    factions:
    - SimpleHostile

