# Base / Dont Touch
- type: entity
  parent: BaseGameRule
  id: BaseStationEventGhostBarSpawn
  components:
  - type: LoadMapRule
    mapPath: /Maps/_Wega/Nonstations/wegabar.yml

- type: entity
  parent: BaseGameRule
  id: SubGamemodesTraitVampRule
  components:
  - type: SubGamemodes
    rules:
    - id: SubWizard
      prob: 0.05
    - id: SubXenoborgs
      prob: 0.25
    - id: Thief
      prob: 0.5

# Rules
# Шаблон 'Хакер': ниндзя + вампиры. Вампиры спавнятся отдельным правилом Vampire.
- type: entity
  parent: BaseGameRule
  id: SubNinja
  components:
  - type: GameRule
    minPlayers: 40
  - type: LoadMapRule
    mapPath: /Maps/_Wega/Nonstations/ninja_planet.yml
  - type: RuleGrids
  - type: AntagLoadProfileRule
  - type: AntagObjectives
    objectives:
    - CollectBloodObjective
    - NinjaSurviveObjective
  - type: AntagRandomObjectives
    maxDifficulty: 12
    sets:
    - groups: NinjaSpawnSets1
      prob: 0.75
      maxPicks: 1
    - groups: NinjaSpawnSets2
      maxPicks: 1
    - groups: NinjaSpawnSets4
      maxPicks: 1
    - groups: NinjaStealSets
      maxPicks: 1
  - type: NinjaDelayedObjectives
    sets:
    - groups: NinjaHackerKillSets
      maxPicks: 1
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    agentName: ninja-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SpaceNinjaRoundstart
      playerRatio: 1

# Шаблон 'Защитник': ниндзя защищает жертву предателей.
# TODO: нужна C# логика для гарантии того, что у предателей есть цель-убийство.
# Предатели спавнятся отдельным правилом Traitor (пресет SubNinjaDefender).
- type: entity
  parent: BaseGameRule
  id: SubNinjaDefender
  components:
  - type: GameRule
    minPlayers: 40
  - type: LoadMapRule
    mapPath: /Maps/_Wega/Nonstations/ninja_planet.yml
  - type: RuleGrids
  - type: AntagLoadProfileRule
  - type: AntagObjectives
    objectives:
    - NinjaSurviveObjective
  - type: AntagRandomObjectives
    maxDifficulty: 7
    sets:
    - groups: NinjaSpawnSets1
      prob: 0.5
      maxPicks: 1
    - groups: NinjaStealSets
      maxPicks: 2
  - type: NinjaDelayedObjectives
    fixedObjectives:
    - NinjaProtectObjective
    - NinjaFrameObjective
    - NinjaIntimidateObjective
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    agentName: ninja-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SpaceNinjaRoundstart
      playerRatio: 1

# Гарантированный 1 вампир для пресета SubNinjaHacker — поверх стандартного Vampire-правила
- type: entity
  parent: BaseGameRule
  id: SubNinjaExtraVampire
  components:
  - type: GameRule
    minPlayers: 1
    cancelPresetOnTooFewPlayers: false
  - type: VampireRule
  - type: AntagObjectives
    objectives:
      - VampireBloodObjective
      - EscapeVampirefShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: VampireObjectiveGroups
      maxPicks: 2
    maxDifficulty: 5
  - type: AntagSelection
    agentName: vampire-round-end-name
    lateJoinAdditional: true
    antags:
    - !type:FixedAntagCount
      proto: Vampire
      playerRatio: 1

# Гарантированный 1 предатель для пресета SubNinjaDefender — поверх стандартного Traitor-правила
- type: entity
  parent: BaseGameRule
  id: SubNinjaExtraTraitor
  components:
  - type: GameRule
    minPlayers: 1
    cancelPresetOnTooFewPlayers: false
  - type: TraitorRule
  - type: AntagRandomObjectives
    sets:
    - groups: TraitorObjectiveGroups
    maxDifficulty: 5
  - type: AntagSelection
    agentName: traitor-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:FixedAntagCount
      proto: Traitor
      playerRatio: 1

- type: entity
  parent: BaseGameRule
  id: Vampire
  components:
  # Corvax-Wega-SubGameRules-start
  - type: SubGamemodes
    rules:
    - id: SubTraitor
      prob: 0.5
  # Corvax-Wega-SubGameRules-end
  - type: GameRule
    minPlayers: 5
  - type: VampireRule
  - type: AntagObjectives
    objectives:
      - VampireBloodObjective
      - EscapeVampirefShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: VampireObjectiveGroups
      maxPicks: 2
    maxDifficulty: 5
  - type: AntagSelection
    agentName: vampire-round-end-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Vampire
      range:
        min: 1
        max: 8

- type: entity
  parent: BaseGameRule
  id: BloodCult
  components:
  - type: GameRule
    minPlayers: 0
  - type: BloodCultRule
  - type: AntagObjectives
    objectives:
      - BloodCultRitualObjective
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: BloodCultist
      playerRatio: 10
      range:
        min: 1
        max: 4

- type: entity
  parent: BaseGameRule
  id: BloodBrothers
  components:
  - type: GameRule
    minPlayers: 20
  - type: BloodBrotherRule
    requiredObjectives:
    - BloodBrotherSharedEscapeObjective
    objectiveSets:
    - groups: BloodBrotherObjectiveGroups
      maxPicks: 3
  - type: AntagSelection
    agentName: blood-brother-round-end-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: BloodBrother
      playerRatio: 1
      range:
        min: 2
        max: 8

- type: entity
  parent: BaseGameRule
  id: VeilCult
  components:
  - type: GameRule
    minPlayers: 30
  - type: VeilCultRule
  - type: AntagObjectives
    objectives:
      - VeilCultRitualObjective
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: VeilCultist
      playerRatio: 10
      range:
        min: 1
        max: 4

# event schedulers

- type: entityTable
  id: LightGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: BasicCalmEventsTable
      - !type:NestedSelector
        tableId: LightAntagEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: CalmPestEventsTable
      - !type:NestedSelector
        tableId: SpicyPestEventsTable

- type: entity
  id: LightStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: LightGameRulesTable
