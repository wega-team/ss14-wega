# Lavaland
- type: biomeTemplate
  id: Lavaland
  layers:
    - !type:BiomeEntityLayer
      threshold: 1
      noise:
        frequency: 1
        seed: 15
      allowedTiles:
        - FloorBasalt
      entities:
        - BasaltOne
        - BasaltTwo
        - BasaltThree
        - BasaltFour
        - BasaltFive
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorBasalt
      threshold: 0.95
      divisions: 1
      noise:
        seed: 25
        frequency: 1
      decals:
        - Basalt1
        - Basalt2
        - Basalt3
        - Basalt4
        - Basalt5
        - Basalt6
        - Basalt7
        - Basalt8
        - Basalt9
    - !type:BiomeEntityLayer
      threshold: 0.94
      noise:
        seed: 3
        noiseType: OpenSimplex2
        frequency: 2
      allowedTiles:
        - FloorBasalt
      entities:
        - LavalandFloraCactus1
        - LavalandFloraCactus2
        - LavalandFloraCactus3
        - LavalandFloraCactus4
        - LavalandFloraFireBlossom1
        - LavalandFloraFireBlossom2
        - LavalandFloraFireBlossom3
        - LavalandFloraFireBlossom4
        - LavalandFloraPolyporeMushroom1
        - LavalandFloraPolyporeMushroom2
        - LavalandFloraPolyporeMushroom3
        - LavalandFloraPolyporeMushroom4
        - LavalandFloraInocybeMushroom1
        - LavalandFloraInocybeMushroom2
        - LavalandFloraInocybeMushroom3
        - LavalandFloraInocybeMushroom4
        - LavalandFloraPorciniMushroom1
        - LavalandFloraPorciniMushroom2
        - LavalandFloraPorciniMushroom3
        - LavalandFloraPorciniMushroom4
        - LavalandFloraEmbershroom1
        - LavalandFloraEmbershroom2
        - LavalandFloraEmbershroom3
        - LavalandFloraEmbershroom4
    - !type:BiomeEntityLayer
      threshold: 0.94
      noise:
        seed: 4
        noiseType: OpenSimplex2
        frequency: 2
      allowedTiles:
        - FloorBasalt
      entities:
        - BasaltRandom
    - !type:BiomeEntityLayer
      threshold: 0.95
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 2
      allowedTiles:
        - FloorBasalt
      entities:
        - FloraRockSolid
    - !type:BiomeEntityLayer
      threshold: 0.2
      noise:
        seed: 10
        frequency: 0.025
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.4
      allowedTiles:
        - FloorBasalt
      entities:
        - FloorLavaEntity
    # Rock formations
    - !type:BiomeEntityLayer
      allowedTiles:
        - FloorBasalt
      threshold: -0.25
      noise:
        seed: 5
        noiseType: Cellular
        frequency: 0.05
        lacunarity: 2
        fractalType: FBm
        octaves: 5
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      # As I can see, it works much better than I could have imagined.
      entityWeights:
        WallRockChromite: 0.647
        WallRockChromiteLavalandTin: 0.04
        WallRockChromiteLavalandCoal: 0.019
        WallRockChromiteLavalandQuartz: 0.019
        WallRockChromiteLavalandPlasma: 0.0098
        WallRockChromiteLavalandSilver: 0.0098
        WallRockChromiteLavalandGold: 0.0098
        WallRockChromiteLavalandUranium: 0.00535
        WallRockChromiteLavalandBananium: 0.00508
        WallRockChromiteLavalandGems: 0.0015
        WallRockChromiteLavalandMagmite: 0.0015
        WallRockChromiteLavalandDiamond: 0.001
        WallRockChromiteLavalandGibtonite: 0.0005
    - !type:BiomeDummyLayer
      id: Loot
    # Fill basalt
    - !type:BiomeTileLayer
      threshold: -1
      tile: FloorBasalt

# Icemoon
- type: biomeTemplate
  id: Icemoon
  layers:
    # Sparse vegetation
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorSnow
      divisions: 2
      threshold: -0.60
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 1
      decals:
        - grasssnowa1
        - grasssnowa2
        - grasssnowa3
        - grasssnowb1
        - grasssnowb2
        - grasssnowb3
        - grasssnowc1
        - grasssnowc2
        - grasssnowc3
    # Dense, bland grass
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorSnow
      divisions: 1
      threshold: -0.25
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      decals:
        - grasssnow
        - grasssnow01
        - grasssnow02
        - grasssnow03
        - grasssnow04
        - grasssnow05
        - grasssnow06
        - grasssnow07
        - grasssnow08
        - grasssnow09
        - grasssnow10
        - grasssnow11
        - grasssnow12
        - grasssnow13
    # Little bit of coloured grass
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorSnow
      divisions: 1
      threshold: -0.05
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 1
        fractalType: None
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      decals:
        - bushsnowa1
        - bushsnowa2
        - bushsnowa3
        - bushsnowb3
        - bushsnowb2
        - bushsnowb3
    - !type:BiomeEntityLayer
      threshold: 0.5
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - FloorSnow
      entities:
        - FloraTreeSnow
        - FloraTreeConifer
    # Rock formations
    - !type:BiomeEntityLayer
      allowedTiles:
        - FloorSnow
      threshold: -0.30
      noise:
        seed: 5
        noiseType: Cellular
        frequency: 0.05
        lacunarity: 2
        fractalType: FBm
        octaves: 5
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      entityWeights:
        WallRockSnow: 0.647
        WallRockSnowIcemoonTin: 0.04
        WallRockSnowIcemoonCoal: 0.019
        WallRockSnowIcemoonQuartz: 0.019
        WallRockSnowIcemoonPlasma: 0.0098
        WallRockSnowIcemoonSilver: 0.0098
        WallRockSnowIcemoonGold: 0.0098
        WallRockSnowIcemoonUranium: 0.00535
        WallRockSnowIcemoonBananium: 0.00508
        WallRockSnowIcemoonGems: 0.0015
        WallRockSnowIcemoonMagmite: 0.0015
        WallRockSnowIcemoonDiamond: 0.001
        WallRockSnowIcemoonGibtonite: 0.0005
    # Ice tiles
    - !type:BiomeTileLayer
      tile: FloorIce
      threshold: -0.9
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.03
        lacunarity: 2
        fractalType: FBm
        octaves: 5
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
    # Liquid plasma rivers. Ice moon baby
    - !type:BiomeEntityLayer
      allowedTiles:
      - FloorSnow
      - FloorIce
      threshold: 0.95
      noise:
        seed: 3
        noiseType: OpenSimplex2
        frequency: 0.003
        lacunarity: 1.50
        fractalType: Ridged
        octaves: 1
      entities:
      - FloorLiquidPlasmaEntity
    - !type:BiomeDummyLayer
      id: Loot
    - !type:BiomeTileLayer
      threshold: -0.7
      tile: FloorSnow
      noise:
        seed: 0
        frequency: 0.02
        fractalType: None
