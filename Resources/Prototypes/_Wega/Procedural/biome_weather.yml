# Basic Lavaland Weather
- type: lavalandWeather
  id: AshStormLight
  weatherPrototype: WeatherAshfallLight
  weight: 30
  damage:
    types:
      Heat: 10
  damageMessage: lavaland-weather-damaged-ash-storm-light
  warningMessage: lavaland-weather-warning-ash-storm-light
  endMessage: lavaland-weather-end-ash-storm-light

- type: lavalandWeather
  id: AshStormHeavy
  weatherPrototype: WeatherAshfallHeavy
  minDurationSeconds: 90
  maxDurationSeconds: 150
  damageIntervalSeconds: 3.33
  weight: 15
  damage:
    types:
      Heat: 40
  damageMessage: lavaland-weather-damaged-ash-storm-heavy
  warningMessage: lavaland-weather-warning-ash-storm-heavy
  endMessage: lavaland-weather-end-ash-storm-heavy

- type: lavalandWeather
  id: AcidRain
  weatherPrototype: WeatherAcidRain
  damageIntervalSeconds: 1.5
  weight: 5
  damage:
    types:
      Caustic: 10
  damageMessage: lavaland-weather-damaged-acid-rain
  warningMessage: lavaland-weather-warning-acid-rain
  endMessage: lavaland-weather-end-acid-rain

- type: lavalandWeather
  id: VolcanicActivity
  specialEffect: VolcanicActivity
  damageMessage: lavaland-weather-damaged-default
  warningMessage: lavaland-weather-warning-volcanic-activity
  endMessage: lavaland-weather-end-volcanic-activity

- type: lavalandWeather
  id: StormWind
  weight: 40
  specialEffect: StormWind
  damageMessage: lavaland-weather-damaged-default
  warningMessage: lavaland-weather-warning-wind
  endMessage: lavaland-weather-end-wind
