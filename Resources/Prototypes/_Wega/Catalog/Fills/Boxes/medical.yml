- type: entity
  parent: BoxCardboard
  id: BoxAutoInjectorAll
  name: autoInjector all
  description: A box full of pill canisters.
  suffix: all
  components:
  - type: Sprite
    sprite: _Wega/Objects/Storage/box_icons.rsi
    layers:
      - state: box # Corvax-Resprite
      - state: medipen
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: AirlossAutoInjector
          amount: 2
        - id: BruteAutoInjector
          amount: 2
        - id: BurnAutoInjector
          amount: 2
        - id: EmergencyMedipen
        - id: RadAutoInjector
        - id: AntiPoisonMedipen

