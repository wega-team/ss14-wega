- type: entity
  parent: BoxCardboard
  id: BoxPillCanisterMech
  description: A box full of pill canisters.
  name: pill canister box
  suffix: mech
  components:
  - type: Sprite
    layers:
      - state: box_of_doom # Corvax-Resprite
      - state: pillbox
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PillCanisterBicaridine
        - id: PillCanisterPuncturase
        - id: PillCanisterLacerinol
        - id: PillCanisterBruzin

