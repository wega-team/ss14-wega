- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphWhiteWolf
  name: Wolf Polymorph
  description: "Turns you into a White wolf."
  components:
  - type: Action
    icon:
      sprite: _Wega/Mobs/Icemoon/wolf.rsi
      state: base
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: WhiteWolf

- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphPolarBear
  name: Polar Bear
  description: "Turns you into a Polar bear."
  components:
  - type: Action
    icon:
      sprite: _Wega/Mobs/Icemoon/polar_bear.rsi
      state: bear
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: PolarBear

- type: entity
  parent: BaseAction
  id: ActionSnowLegionSummon
  name: Summon Skull
  description: "Summons the skull of the snow Legion."
  components:
  - type: Action
    raiseOnUser: true
    icon:
      sprite: _Wega/Mobs/Icemoon/legionskull.rsi
      state: head
    itemIconStyle: BigAction
    useDelay: 5
  - type: TargetAction
    range: 10
  - type: EntityTargetAction
    event: !type:LegionSummonSkullAction
      entityId: MobSnowLegionSkull

