- type: entity
  id: ActionBackToAi
  parent: BaseAction
  name: Back to Ai
  description: Sends your mind back to the core.
  components:
  - type: Action
    icon: { sprite: Interface/Actions/actions_ai.rsi, state: ai_core }
  - type: InstantAction
    event: !type:ReturnMindIntoAiEvent
    
- type: entity
  id: ActionOpenRemoteDevicesMenu
  parent: BaseAction
  name: Open list of remote devices
  description: Opens a menu with available remote devices.
  components:
  - type: Action
    icon: { sprite: Mobs/Silicon/chassis.rsi, state: robot }
  - type: InstantAction
    event: !type:ToggleRemoteDevicesScreenEvent