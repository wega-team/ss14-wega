- type: entity
  parent: BaseAction
  id: ActionSeraphimKnee
  name: "[color=cyan]Удар в колено[/color]"
  description: "Заготовленный удар: следующая атака без оружия надолго замедлит цель."
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 20
  - type: Sprite
    sprite: _Wega/Interface/Actions/seraphim.rsi
    layers:
    - state: knee
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:SeraphimKneeActionEvent

