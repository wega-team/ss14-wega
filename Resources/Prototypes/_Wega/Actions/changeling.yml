- type: entity
  id: ActionToggleTherlamChangeling
  parent: BaseAction
  name: toggle vision
  description: "Blink to see the world differently."
  components:
  - type: Action
    priority: -20
    useDelay: 1
  - type: Sprite
    sprite: _Wega/Interface/Actions/action_changeling.rsi
    layers:
    - state: thermal
      map: ["enum.ActionVisuals.Icon"]
    - state: thermal
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ToggleActionEvent