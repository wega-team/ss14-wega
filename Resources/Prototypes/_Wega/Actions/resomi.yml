- type: entity
  id: SwitchAgilityAction
  parent: BaseAction
  name: Switch agility
  description: Switching agility
  components:
  - type: Action
  - type: Sprite
    layers:
    - texture: _Wega/Mobs/Species/Resomi/Abilities/Agility/AgilityOff.png
      map: ["enum.ActionVisuals.Icon"]
    - texture: _Wega/Mobs/Species/Resomi/Abilities/Agility/AgilityOn.png
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:SwitchAgillityActionEvent

- type: entity
  id: SwitchListenUpAction
  parent: BaseAction
  name: Listen up
  description: Listen up
  components:
  - type: Action
  - type: Sprite
    layers:
    - texture: _Wega/Mobs/Species/Resomi/Abilities/ListenUp/EarsDown.png
      map: ["enum.ActionVisuals.Icon"]
    - texture: _Wega/Mobs/Species/Resomi/Abilities/ListenUp/EarsUp.png
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ListenUpActionEvent
