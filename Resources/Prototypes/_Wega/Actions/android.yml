- type: entity
  parent: BaseAction
  id: ActionBodyPartImplantJump
  name: Active Jump leg
  description: Use your implant and make a quick jump forward.
  components:
  - type: Action
    useDelay: 6
  - type: Sprite
    sprite: _Wega/Interface/Actions/actions_android.rsi
    layers:
    - state: jump-action
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:GravityJumpEvent {}

- type: entity
  parent: BaseAction
  id: ActionBodyPartImplantCharge
  name: Charge battery
  description: Charge the device in your hands.
