- type: entity
  id: SwitchBloodSenseAction
  parent: BaseAction
  name: Switch blood sense
  description: Switching blood sense
  components:
  - type: Action
    useDelay: 1
  - type: Sprite
    layers:
    - sprite: Interface/Alerts/bleed.rsi
      state: bleed0
      map: ["enum.ActionVisuals.Icon"]
    - sprite: Interface/Alerts/bleed.rsi
      state: bleed10
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:SwitchBloodSenseActionEvent
