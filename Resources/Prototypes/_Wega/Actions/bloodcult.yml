# Construct
- type: entity
  id: TeleportConstructSpell
  parent: BaseActionPolymorph
  name: Disembodied
  description: "An ability that allows you to descri pass through the visible and invisible."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
  - type: Sprite
    sprite: _Wega/Interface/Actions/actions_bloodcult.rsi
    layers:
    - state: wraith_teleport
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: FantomJaunt

- type: entity
  id: WallBuildConstructSpell
  parent: BaseAction
  name: Build wall
  description: "Build a wall."
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 60
  - type: Sprite
    sprite: Structures/Walls/brick.rsi
    layers:
    - state: full
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    checkCanAccess: false
    range: 3
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: WallBrick
        amount: 1

- type: entity
  id: ConstructBuildConstructSpell
  parent: BaseAction
  name: Build construct
  description: "Build a construct."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 180
  - type: Sprite
    sprite: _Wega/Structures/Specific/bloodcult_structures.rsi
    layers:
    - state: construct-cult
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 3
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: BloodCultConstruct
        amount: 1

- type: entity
