# Basic
- type: entity
  id: ActionBloodMagic
  parent: BaseAction
  name: "[color=red]Blood magic[/color]"
  description: "Summon abilities with your blood."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 15
    priority: 1
  - type: Sprite
    sprite: _Wega/Interface/Actions/actions_bloodcult.rsi
    layers:
    - state: blood_magic
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:BloodCultBloodMagicActionEvent

- type: entity
  id: ActionRecallBloodDagger
  parent: BaseAction
  name: "[color=red]Recall dagger[/color]"
  description: "If it exists, it will definitely come back to you."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
  - type: Sprite
    sprite: _Wega/Interface/Actions/actions_bloodcult.rsi
    layers:
    - state: recall_dagger
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:RecallBloodDaggerEvent

