- type: entity
  id: ActionGenCloakOfDarkness
  parent: BaseAction
  name: cloak of darkness
  description: "You are a shadow."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 15
  - type: Sprite
    sprite: Clothing/Neck/Cloaks/void.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CloakOfDarknessActionEvent

- type: entity
  id: ActionGenPolymorphism
  parent: BaseAction
  name: polymorphism
  description: "Take on someone else's form."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 300
  - type: Sprite
    sprite: Clothing/Neck/Cloaks/void.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:PolymorphismActionEvent

