#region Basic
- type: entity
  id: ActionVampireSelectClass
  parent: BaseAction
  name: "[color=purple]Select class[/color]"
  description: "Select your class."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
  - type: Sprite
    sprite: _Wega/Interface/Actions/actions_vampire.rsi
    layers:
    - state: select_class
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:VampireSelectClassActionEvent
      bloodCost: 150

- type: entity
  id: ActionDrinkBlood
  parent: BaseAction
  name: "[color=purple]Drink blood[/color]"
  description: "Attempt to drink blood from a humanoid target."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -2
  - type: Sprite
    sprite: _Wega/Interface/Actions/actions_vampire.rsi
    layers:
    - state: bite
      map: ["enum.ActionVisuals.Icon"]
    - state: bite-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:VampireDrinkingBloodActionEvent

- type: entity
  id: ActionVampireRejuvenate
  parent: BaseAction
  name: "[color=purple]Rejuvenate[/color]"
  description: "Your second chance, your second wind."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    useDelay: 5
    priority: 1
  - type: Sprite
    sprite: _Wega/Interface/Actions/actions_vampire.rsi
    layers:
    - state: rejuvenate
      map: ["enum.ActionVisuals.Icon"]
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 20
  - type: InstantAction
    event: !type:VampireRejuvenateActionEvent
      bloodCost: 200
      heal:
        types:
          Asphyxiation: -5
          Heat: -2
          Poison: -2
      healGroups:
        groups:
          Brute: -2

- type: entity
  id: ActionVampireGlare
  parent: BaseAction
  name: "[color=purple]Glare[/color]"
  description: "Hit your victim with a beam of bright light so that she loses herself."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/_Wega/Effects/Vampire/glare.ogg
    checkCanInteract: false
    useDelay: 3
    priority: 1
  - type: Sprite
    sprite: _Wega/Interface/Actions/actions_vampire.rsi
    layers:
    - state: glare
      map: ["enum.ActionVisuals.Icon"]
  - type: LimitedCharges
    maxCharges: 2
  - type: AutoRecharge
    rechargeDuration: 30
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:VampireGlareActionEvent

# Diablerie
- type: entity
  id: ActionVampireSacramentInitiation
  parent: BaseAction
  name: "[color=purple]Sacrament of Initiation[/color]"
  description: "You have reached the peak of your power. For 50 blood, you can raise the dead as free-willed vampires. They are not your thralls."
