- type: entity
  parent:  BaseKillObjective
  id: SnailKillRandomPersonObjective
  description: Do it however you like, just make sure they don't get off the station.
  components:
  - type: Objective
    difficulty: 1.75
    unique: true
  - type: TargetObjective
    title: objective-condition-maroon-person-title
  - type: PickRandomPerson
    filters:
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireMaroon: true
  - type: RoleRequirement
    roles:
    - SnailImmortalRole