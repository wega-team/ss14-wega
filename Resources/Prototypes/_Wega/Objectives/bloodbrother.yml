# BadgeSec
- type: entity
  parent: BaseBloodBrotherStealObjective
  id: BloodBrotherBadgeSecStealObjective
  components:
  - type: Objective
    difficulty: 1
  - type: NotJobRequirement
    jobs: [ SecurityOfficer, HeadOfSecurity, Detective, Warden ]
