- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceReturned
  name: returned appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganReturnedTorso
      Head: OrganReturnedHead
      ArmLeft: OrganReturnedArmLeft
      ArmRight: OrganReturnedArmRight
      HandLeft: OrganReturnedHandLeft
      HandRight: OrganReturnedHandRight
      LegLeft: OrganReturnedLegLeft
      LegRight: OrganReturnedLegRight
      FootLeft: OrganReturnedFootLeft
      FootRight: OrganReturnedFootRight
      Brain: OrganReturnedBrain
      Eyes: OrganReturnedEyes
      Tongue: OrganReturnedTongue
      Appendix: OrganReturnedAppendix
      Ears: OrganReturnedEars
      Lungs: OrganReturnedLungs
      Heart: OrganReturnedHeart
      Stomach: OrganReturnedStomach
      Liver: OrganReturnedLiver
      Kidneys: OrganReturnedKidneys
  - type: HumanoidProfile
    species: Returned

- type: entity
  parent:
  - AppearanceReturned
  - BaseSpeciesMobOrganic
  - BaseOperated
  id: MobReturned
  name: Urist McReturned
  components:
  - type: ContentEye
    targetZoom: "0.9, 0.9"
    maxZoom: "0.9, 0.9"
  - type: Butcherable
    spawned:
    - id: FoodMeatRotten
      amount: 5
  - type: Temperature
    heatDamageThreshold: 360
    coldDamageThreshold: 243.15
    currentTemperature: 310.15
    specificHeat: 46
    coldDamage:
      types:
        Cold: 0
    heatDamage:
      types:
        Heat: 0.1
  - type: Damageable
    damageModifierSet: Zombie
  - type: Pacified
  - type: StutteringAccent
  - type: Bloodstream
    bloodReagent: CopperBlood
  - type: ZombieImmune
  - type: Internals
  - type: PassiveDamage
    allowedStates:
    - Alive
    damageCap: 20
    damage:
      types:
        Heat: -0.07
        Blunt: -0.4
        Slash: -0.2
        Piercing: -0.2
      groups:
        Brute: -0.07
  - type: FireVisuals
    alternateState: Standing
  - type: Vocal
    emoteSounds: ReturnedM

