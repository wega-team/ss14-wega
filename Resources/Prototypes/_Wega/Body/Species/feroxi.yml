    organs:
      Head: OrganFeroxiHead
      Torso: OrganFeroxiTorso
      ArmLeft: OrganFeroxiArmLeft
      ArmRight: OrganFeroxiArmRight
      HandLeft: OrganFeroxiHandLeft
      HandRight: OrganFeroxiHandRight
      LegLeft: OrganFeroxiLegLeft
      LegRight: OrganFeroxiLegRight
      FootLeft: OrganFeroxiFootLeft
      FootRight: OrganFeroxiFootRight
      Brain: OrganFeroxiBrain
      Ears: OrganFeroxiEars
      Tongue: OrganFeroxiTongue
      Appendix: OrganFeroxiAppendix
      Lungs: OrganFeroxiLungs
      Heart: OrganFeroxiHeart
      Stomach: OrganFeroxiStomach
      Liver: OrganFeroxiLiver
      Kidneys: OrganFeroxiKidneys
      Eyes: OrganFeroxiEyes
  - type: HumanoidProfile
    species: Feroxi
    height: 160
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: shoes
      socks:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: socks
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: shoes
      socks:
        sizeMaps:
          32:
            sprite: Corvax/Mobs/Species/displacement.rsi
            state: socks

- type: entity
  id: MobFeroxi
  name: Urist McShark
  parent: [AppearanceFeroxi, BaseSpeciesMobOrganic, BaseOperated]
  components:
  - type: Damageable
    damageModifierSet: Feroxi
  - type: MeleeWeapon
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 6
        Slash: 2
  - type: Satiation
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: FeroxiThirst
  - type: SatiationDamage
    satiations:
      Thirst:
        thresholds:
          Parched:
            types:
              Asphyxiation: 1
  - type: ActionGrant
    actions:
    - SwitchBloodSenseAction
  - type: BloodSense

