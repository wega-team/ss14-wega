- type: gameMap
  id: WegaFland
  mapName: 'Fland Installation'
  mapPath: /Maps/_Wega/wegafland.yml
  minPlayers: 65
  stations:
    Fland:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Fland Installation {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'B'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_delta.yml
        - type: StationCargoShuttle
          path: /Maps/Shuttles/cargo_fland.yml
        - type: StationLavaland
          planets: [ Lavaland, Icemoon ]
          avanposts:
            Lavaland:
            - "/Maps/_Wega/Nonstations/cyberiadavanpost.yml"
            Icemoon:
            - "/Maps/_Wega/Nonstations/cyberiadavanpostalt.yml"
        - type: StationJobs
