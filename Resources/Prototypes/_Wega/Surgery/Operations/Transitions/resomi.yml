# ========================
# ПЕРЕХОДЫ КОНЕЧНОСТЕЙ
# ========================

# ЛЕВАЯ РУКА
- type: surgeryTransition
  id: ResomiAmputateLeftArmTransition
  target: ResomiAmputateLeftArmStart
  label: Манипуляции с левой рукой
  stepGroups:
    - steps:
        - tool: [ Scalpel ]
          tag: [ Knife, Shiv, BasicGlassShard, Wirecutter ]
          action: Cut
          failureEffect: [ Cut, Bleeding ]
          requiredPart: ArmLeft
          sound:
            collection: Scalpel
          time: 4
          successChance: 0.95
          conditions:
            - !type:OrganPresentCondition
              organ: ArmLeft

- type: surgeryTransition
  id: ResomiAmputateLeftArmFinishTransition
  target: EndOperation
  label: Ампутировать левую руку
  stepGroups:
    - steps:
        - tool: [ Sawing ]
          tag: [ BotanyHatchet, FireAxe ]
          action: RemoveOrgan
          failureEffect: [ Bleeding, Pain ]
          requiredPart: ArmLeft
          sound:
            path: /Audio/_Wega/Medical/Surgery/saw.ogg
          time: 8

- type: surgeryTransition
  id: ResomiAttachLeftArmStartTransition
  target: ResomiAttachLeftArmProcess
  label: Прикрепить левую руку
  stepGroups:
    - steps:
        - tool: [ Scalpel ]
          tag: [ Knife, Shiv, BasicGlassShard, Wirecutter ]
          action: Cut
          failureEffect: [ Cut, Bleeding ]
          requiredPart: ArmLeft
          sound:
            collection: Scalpel
          time: 4
          successChance: 0.95
          conditions:
            - !type:OrganPresentCondition
              invert: true
              organ: ArmLeft

- type: surgeryTransition
  id: ResomiAttachLeftArmProcessTransition
  target: EndOperation
  label: Прикрепить левую руку
  stepGroups:
    - conditions:
        - !type:OrganPresentCondition
          invert: true
          organ: ArmLeft
      steps:
        - tool: [ Hemostat ]
          tag: [ CableCoil, Crowbar ]
          action: ClampBleeding
          failureEffect: [ Bleeding, Pain ]
          requiredPart: ArmLeft
          sound:
            path: /Audio/_Wega/Medical/Surgery/hemostat1.ogg
          time: 3
          successChance: 0.95
        - tool: [ Retractor ]
          tag: [ Crowbar ]
          action: Retract
          failureEffect: [ Pain ]
          sound:
            collection: Retractor
          time: 4
        - tool: [ Scalpel ]
          tag: [ Knife, Shiv, BasicGlassShard, Wirecutter ]
          action: Cut
          failureEffect: [ Cut, Bleeding ]
          requiredPart: ArmLeft
          sound:
            collection: Scalpel
          time: 4
          successChance: 0.95
        - tag: [ ResomiLeftArm ]
          action: InsertOrgan
          failureEffect: [ Pain ]
          requiredPart: ArmLeft
          time: 6
          successChance: 0.85

