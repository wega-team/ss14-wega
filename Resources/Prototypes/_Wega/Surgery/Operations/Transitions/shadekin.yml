- type: surgeryTransition
  id: ShadekinOpenTorsoTransition
  target: ShadekinTorsoOpen
  label: Вскрыть торс
  stepGroups:
    - conditions:
        - !type:ClothingCondition
          invert: true
          slots:
          - jumpsuit
          - outerClothing
      steps:
        - tool: [ Scalpel ]
          tag: [ Knife, Shiv, BasicGlassShard, Wirecutter ]
          action: Cut
          failureEffect: [ Cut, Bleeding ]
          sound:
            collection: Scalpel
          time: 4
          successChance: 0.95
        - tool: [ Hemostat ]
          tag: [ CableCoil, Crowbar ]
          action: ClampBleeding
          failureEffect: [ Bleeding, Pain ]
          sound:
            path: /Audio/_Wega/Medical/Surgery/hemostat1.ogg
          time: 3
          successChance: 0.95
        - tool: [ Retractor ]
          tag: [ Crowbar ]
          action: Retract
          failureEffect: [ Pain ]
          sound:
            collection: Retractor
          time: 4
        - tool: [ Sawing ]
          tag: [ BotanyHatchet, FireAxe ]
          action: Cut
          failureEffect: [ Cut, Bleeding, Pain ]
          sound:
            path: /Audio/_Wega/Medical/Surgery/saw.ogg
          time: 6
          successChance: 0.95
        - tool: [ Retractor ]
          tag: [ Crowbar ]
          action: Retract
          failureEffect: [ Pain ]
          sound:
            collection: Retractor
          time: 4

- type: surgeryTransition
  id: ShadekinOrganManipulationTransition
  target: OrganManipulation
  label: Манипуляция с органами
  stepGroups:
    - conditions:
        - !type:ClothingCondition
          invert: true
          slots:
          - jumpsuit
          - outerClothing
      parallel: true
      steps:
        # Сердце
        - tool: [ Hemostat ]
          tag: [ CableCoil, Crowbar ]
          action: RemoveOrgan
          failureEffect: [ Bleeding, Pain ]
          entityPreview: OrganShadekinHeart
          requiredPart: Heart
          sound:
            path: /Audio/_Wega/Medical/Surgery/hemostat1.ogg
          time: 3
          successChance: 0.8
          conditions:
            - !type:OrganPresentCondition
              organ: Heart
        - tag: [ Heart ]
          action: InsertOrgan
          failureEffect: [ Pain ]
          entityPreview: OrganShadekinHeart
          requiredPart: Heart
          sound:
            collection: Organ
          time: 3
          successChance: 0.8
          conditions:
            - !type:OrganPresentCondition
              invert: true
              organ: Heart

        # Легкие
