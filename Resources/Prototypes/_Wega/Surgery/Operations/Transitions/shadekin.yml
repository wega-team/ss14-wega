- type: surgeryTransition
  id: ShadekinCloseTorsoTransition
  target: Default
  label: Закрыть торс
  stepGroups:
    - conditions:
        - !type:ClothingCondition
          invert: true
          slots:
          - jumpsuit
          - outerClothing
      steps:
        - tool: [ Retractor ]
          tag: [ Crowbar ]
          action: Retract
          failureEffect: [ Pain ]
          sound:
            collection: Retractor
          time: 4
        - tool: [ BoneGel ]
          tag: [ Screwdriver ]
          action: Empty
          time: 6
        - tool: [ BoneSetter ]
          tag: [ Wrench ]
          action: Empty
          failureEffect: [ Fracture, Pain ]
          time: 8
        - tool: [ BoneGel ]
          tag: [ Screwdriver ]
          action: Empty
          time: 4
        - tool: [ Cautery ]
          tag: [ Cigarette, Lighter, Welder ]
          action: ClampBleeding
          failureEffect: [ Burn ]
          sound:
            collection: Cautery
          time: 8
