  name: magic hat
  description: A strange-looking blue hat that most certainly belongs to a powerful magic-user.
  components:
  - type: Sprite
    sprite: _Wega/Sponsors/Clothing/Head/Hats/magic_hat.rsi
  - type: Clothing
    sprite: _Wega/Sponsors/Clothing/Head/Hats/magic_hat.rsi
