- type: entity
  id: ActionGhostBar
  parent: BaseAction
  name: Ghost bar
  description: Go to the GhostBar!
  components:
  - type: Action
    checkCanInteract: false
    startDelay: true
    useDelay: 30
  - type: Sprite
    layers:
    - texture: _Wega/Interface/Actions/ghostbar.png
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleGhostBarEvent
