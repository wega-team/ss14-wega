  # - Body

- type: body
  name: "returned"
  id: Returned
  root: torso
  slots:
    head:
      part: HeadReturned
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
    torso:
      part: TorsoReturned
      organs:
        heart: OrganAnimalHeart
        lungs: OrganHumanLungs
        liver: OrganAnimalLiver
        kidneys: OrganHumanKidneys
      connections:
      - right arm
      - left leg
      - right leg
    right arm:
      part: RightArmReturned
      connections:
      - right hand
    right hand:
      part: RightHandReturned
    right leg:
      part: RightLegReturned
      connections:
      - right foot
    left leg:
      part: LeftLegReturned
      connections:
      - left foot
    right foot:
      part: RightFootReturned
    left foot:
      part: LeftFootReturned

