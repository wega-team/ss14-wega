- type: entity
  save: false
  name: Urisst' Mzhand
  parent:
  - MobBloodstream
  - MobFlammable
  - BaseMobSpecies
  id: BaseMobReturned
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Returned
  - type: Icon
    sprite: _Wega/Mobs/Species/Zombie/parts.rsi
    state: full
  - type: ContentEye
    targetZoom: "0.9, 0.9"
    maxZoom: "0.9, 0.9"
  - type: Body
    prototype: Returned
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatRotten
      amount: 5
  - type: Temperature
    heatDamageThreshold: 360
    coldDamageThreshold: 243.15
    currentTemperature: 310.15
    specificHeat: 46
    coldDamage:
      types:
        Cold : 0
    heatDamage:
      types:
        Heat : 0.1
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Zombie
  - type: Carriable
  - type: Pacified
  - type: StutteringAccent
  - type: Bloodstream
    bloodReagent: CopperBlood
  - type: ZombieImmune
  - type: Internals
  - type: PassiveDamage 
    allowedStates:
    - Alive
    damageCap: 20
    damage:
      types:
        Heat: -0.07
        Blunt: -0.4
        Slash: -0.2
        Piercing: -0.2
      groups:
        Brute: -0.07
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - SeeingRainbows
    - Electrocution
    - ForcedSleep
    - TemporaryBlindness
    - Drunk
    - SlurredSpeech
    - RatvarianLanguage
    - PressureImmunity
    - Muted
    - Pacified
    - StaminaModifier
  - type: Blindable
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 25
  - type: FireVisuals
    alternateState: Standing
  - type: Vocal
    sounds:
      Male: ReturnedM
      Female: ReturnedF
      Unsexed: ReturnedM

