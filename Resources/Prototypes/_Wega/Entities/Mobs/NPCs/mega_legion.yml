- type: entity
  id: BaseLegionBoss
  abstract: true
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 1
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: "human"
  - type: LagCompensation
  - type: MobMover
  - type: Tag
    tags:
    - CannotSuicide
  - type: NoSlip
  - type: MobState
  - type: CombatMode
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Skeleton
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.2
    baseSprintSpeed: 4.2
  - type: HTN
    rootTask:
      task: LegionBehaviorCompound
  - type: NpcFactionMember
    factions:
    - LavalandFauna
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 25
  - type: Megafauna
  - type: MegafaunaAwareness
  - type: MegafaunaAttacks
  - type: LegionBoss
    lootPrototypes:
      MaterialBones1: 1
      CrateNecropolisFilled: 0.2

- type: entity
  parent: BaseLegionBoss
  id: LegionBoss
  name: legion
  description: A massive floating skull that watches over the necropolis. Destroy it before it multiplies!
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Lavaland/mega_legion96.rsi
    state: mega_legion
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Dead
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 20
  - type: LegionBoss
    summonCount: 3
    lootPrototypes:
      MaterialBones: 1
      CrateNecropolisFilled: 0.2

