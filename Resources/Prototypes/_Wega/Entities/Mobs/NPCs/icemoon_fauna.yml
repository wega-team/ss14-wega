- type: entity
  id: BaseMobIcemoon
  parent:
  - BaseMob
  - MobDamageable
  - MobAtmosExposed
  - MobCombat
  suffix: AI
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 40
      behaviors:
      - !type:VomitBehavior
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch, Ingestion]
  - type: Climbing
  - type: NameIdentifier
    group: GenericNumber
  - type: StatusEffects
    allowed:
    - Electrocution
    - TemporaryBlindness
    - RadiationProtection
    - Adrenaline
  - type: MovementSpeedModifier
    baseFriction: 50 # No affected by ice
  - type: StandingState
  - type: Tag
    tags:
    - DoorBumpOpener
    - StunImmune
  - type: LavalandVisitor
    immuneToStorm: true
  - type: Unrevivable # If his dead - his is dead
    analyzable: false
  - type: NPCAggression
  - type: NpcFactionMember
    factions:
    - IcemoonFauna

- type: entity
  id: BaseMobIcemoonButcherable
  abstract: true
  components:
  - type: ToolRefinable
    qualityNeeded: Slicing
    refineResult: []
    refineTime: 4

#region White Wolf
- type: entity
  parent: [ BaseMobIcemoon, MobBloodstream, BaseMobIcemoonButcherable ]
  id: MobWhiteWolf
  name: white wolf
  description: "A cunning predator hunting in a pack. Despite its weak bite, it becomes dangerously fast when wounded, preferring to retreat and regroup."
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Icemoon/wolf.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: base
    - map: ["enum.DamageStateVisualLayers.BaseUnshaded", "movement_eyes"]
      shader: unshaded
      state: eyes
      color: Red
  - type: SpriteMovement
    movementLayers:
      movement:
        state: base_moving
      movement_eyes:
        state: eyes_moving
    noMovementLayers:
      movement:
        state: base
      movement_eyes:
        state: eyes
  - type: DamageStateVisuals
    states:
      Alive:
        Base: wolf
        BaseUnshaded: eyes
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 4.5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 200
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 1.5
  - type: MeleeWeapon
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 7.5
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: ToolRefinable
    refineResult:
    - id: FoodMeat
      amount: 2
    - id: MaterialSinew1
      amount: 2
    - id: MaterialBones1
      amount: 2
  - type: TrophyHunter
    trophy: TrophyIcemoonWhiteWolfEar

- type: entity
  parent: MobWhiteWolf
  id: MobWhiteWolfPolymorph
  categories: [ HideSpawnMenu ]
  components:
  - type: TrophyHunter
    trophy: TrophyIcemoonWhiteWolfEar
    dropChance: 0 # No
  - type: NpcFactionMember
    factions:
    - NanoTrasen # Glory NanoTrasen!
#endregion

#region Ice Demon
- type: entity
  parent: BaseMobIcemoon
  id: MobIceDemon
  name: ice demon
  description: "A mischievous creature that dances between dimensions. It fires slow ice blasts that chill its prey to the bone, and teleports erratically to avoid retaliation. When cornered, it splits into fading afterimages."
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Icemoon/ice_demon.rsi
    state: demon
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.735
    baseSprintSpeed: 3.735
  - type: NoSlip
  - type: IceDemon
  - type: HTN
    rootTask:
      task: LegionBehaviorCompound
  - type: NPCUseActionsOnTarget
    actionIds:
    - ActionIceDemonShot
    - ActionIceDemonTeleport
    actionChances:
      ActionIceDemonShot: 0.6
      ActionIceDemonTeleport: 0.4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardCrystalBlue:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TrophyHunter
    trophy: TrophyIcemoonIceDemonCube

- type: entity
  parent: BaseMobIcemoon
  id: MobIceDemonAfterimage
  name: ice demon afterimage
  description: "A flickering remnant of the Ice Demon, desperately rushing toward its prey. It shatters in a single hit, but any damage dealt to it is redirected to the original."
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Icemoon/ice_demon.rsi
    state: demon
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.735
    baseSprintSpeed: 3.735
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NoSlip
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fade
    fadeDuration: 15
  - type: TimedDespawn
    lifetime: 15
#endregion

#region Polar Bear
- type: entity
  parent: [ BaseMobIcemoon, MobBloodstream, BaseMobIcemoonButcherable ]
  id: MobPolarBear
  name: polar bear
  description: "A massive beast driven by pure rage and hunger. It charges without mercy, and when wounded, its fury only intensifies its attacks become twice as fast, leaving little room for error."
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Icemoon/polar_bear.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: bear
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bear
      Dead:
        Base: bear_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 300
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      200: 2
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 5
        Slash: 10
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Vocal
    emoteSounds: Bear
  - type: InteractionPopup
    successChance: 0.25
    interactSuccessString: petting-success-bear
    interactFailureString: petting-failure-bear
    interactSuccessSound:
      path: /Audio/Animals/sloth_squeak.ogg
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatBear
      amount: 3
    - id: MaterialBones1
      amount: 2
    - id: MaterialPolarBearHide1
      amount: 2
  - type: TrophyHunter
    trophy: TrophyIcemoonPolarBearPaw

- type: entity
  parent: MobPolarBear
  id: MobPolarBearPolymorph
  categories: [ HideSpawnMenu ]
  components:
  - type: TrophyHunter
    trophy: TrophyIcemoonPolarBearPaw
    dropChance: 0 # No
  - type: NpcFactionMember
    factions:
    - NanoTrasen # Glory NanoTrasen!
#endregion

#region Snow Legion
- type: entity
  parent: BaseMobIcemoon
  id: MobSnowLegion
  name: snow legion
  description: "A wretched amalgamation of frozen souls and drifting snow. It refuses to fight fair, always retreating while summoning lesser copies to do its bidding. Those who fall to its minions become part of the legion themselves."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Icemoon/legion.rsi
    state: legion
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: NoSlip
  - type: Damageable
    damageModifierSet: Skeleton
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.735
    baseSprintSpeed: 3.735
  - type: LegionFauna
    basePolymorph: SnowLegionPolymorph
    dwarfPolymorph: SnowLegionDwarfPolymorph
  - type: HTN
    rootTask:
      task: LegionBehaviorCompound
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        9
  - type: NPCUseActionOnTarget
    actionId: ActionSnowLegionSummon
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
    - StunImmune

- type: entity
  parent: MobSnowLegion
  id: MobSnowLegionIcemoon
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          RandomLegionCorpse:
            min: 1
            max: 1
          LegionCore:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TrophyHunter
    trophy: TrophyLavalandLegionSkull

# And here it is small XD
- type: entity
  parent: MobSnowLegion
  id: MobSnowLegionDwarf
  components:
  - type: Sprite
    state: dwarf_legion
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 5.625
    baseSprintSpeed: 5.625

- type: entity
  parent: BaseMobIcemoon
  id: MobSnowLegionSkull
  name: snow legion skull
  description: "A detached skull of the Snow Legion, animated by its master's will. Frail and relentless, it bites at anything that moves until destroyed."
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Icemoon/legionskull.rsi
    state: head
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 130
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: NoSlip
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 4.5
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 5
  - type: TimedDespawn
    lifetime: 30
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
#endregion

#region Ice Whelp
- type: entity
  parent: [ BaseMobIcemoon, BaseMobIcemoonButcherable ]
  id: MobIceWhelp
  name: ice whelp
  description: "A young ice drake with a chilling breath. It freezes its prey in place before closing in for the kill. Its attacks are telegraphed, giving victims a brief moment to dodge — but one mistake means becoming its next meal."
  components:
  - type: Sprite
    sprite: _Wega/Mobs/Icemoon/whelp.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.735
    baseSprintSpeed: 3.735
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: MeleeWeapon
    ignoreAttempted: true
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    attackRate: 0.5
    damage:
     types:
       Slash: 20
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NPCUseActionsOnTarget
    actionIds:
    - ActionIceWhelpLineBreath
    - ActionIceWhelpCircleBreath
    actionChances:
      ActionIceWhelpLineBreath: 0.75
      ActionIceWhelpCircleBreath: 0.25
  - type: ToolRefinable
    refineResult:
    - id: DiamondOre1
      amount: 3
    - id: MaterialSinew1
      amount: 2
    - id: MaterialDragonHide1
      amount: 1
    - id: MaterialBones1
      amount: 10
  # He doesn't have any trophy.
  # - type: TrophyHunter
  #   trophy: TrophyIcemoon
#endregion
