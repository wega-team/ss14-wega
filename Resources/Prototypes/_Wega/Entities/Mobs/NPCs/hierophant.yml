- type: entity
  id: HierophantBoss
  name: hierophant
  description: A massive metal club that hangs in the air as though waiting. It'll make you dance to its beat.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.6,0.35,0.6"
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: "human"
  - type: LagCompensation
  - type: MobMover
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: RequireProjectileTarget
    active: False
  - type: CombatMode
  - type: MobState
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Wega/Mobs/Lavaland/hierophant.rsi
    state: hierophant
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: Tag
    tags:
    - CannotSuicide
  - type: NoSlip
  - type: AmbientSound
    sound:
      path: "/Audio/_Wega/Mobs/Lavaland/hiero_bgm.ogg"
    enabled: false
    volume: 2
    range: 15
  - type: NpcFactionMember
    factions:
    - LavalandFauna
  - type: HierophantBoss
  - type: Megafauna
    bossMusic:
      path: "/Audio/_Wega/Mobs/Lavaland/hiero_bgm.ogg"
  - type: MegafaunaAwareness
    autoAggro: false
  - type: MegafaunaAttacks

- type: entity
  id: HierophantChaser
  suffix: DO NOT MAP
  name: hierophant chaser
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: HierophantChaser
