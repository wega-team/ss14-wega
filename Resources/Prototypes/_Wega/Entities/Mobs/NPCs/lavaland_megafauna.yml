- type: entity
  id: BaseMobMegafauna
  abstract: true
  components:
  - type: Megafauna
  - type: NoSlip
  - type: NpcFactionMember
    factions:
    - LavalandFauna
  - type: LavalandVisitor
    immuneToStorm: true
  - type: Unrevivable
    analyzable: false
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - StunImmune
    - SlowImmune

#region Blood Drunk Miner
- type: entity
  parent: [ BaseMobMegafauna, BaseMobHuman ]
  id: MobBloodDrunkMiner
  name: unknown miner
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1200
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
  - type: NpcFactionMember
    factions:
      - AllHostile
  - type: Loadout
    prototypes:
      - BloodDrunkMinerGear
  - type: InputMover
  - type: MobMover
  - type: ScaleVisuals
    scale: 1.172, 1.172
  - type: MobThresholds
    thresholds:
      0: Alive
      900: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      540: 0.7
      720: 0.5
      900: 0.3
  - type: BloodDrunkMiner
  - type: NPCHandSwitcher
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: NPCUseActionOnTarget
    actionId: ActionBloodDrunkMinerDash
  - type: DnaModifier
    upper: null
    lowest: null
  - type: TrophyHunter
    trophy: TrophyLavalandBDMEye
    dropChance: 1 # Guaranteed, since it's the boss

- type: startingGear
  id: BloodDrunkMinerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSalvageSpecialist
    id: SalvagePDA
    ears: ClothingHeadsetCargo
    eyes: ClothingEyesGlassesMeson
    mask: ClothingMaskGasExplorer
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsSalvage
    underwearbottom: ClothingUnderBottomGrey
    head: ClothingHeadHatHoodExplorerBDM
    outerClothing: ClothingOuterArmorExplorerSuitBDM
    suitstorage: OxygenTankFilled
  inhand:
    - WeaponCleawingSaw
    - WeaponProtoKineticAcceleratorBDM
#endregion

#region Hierophant
- type: entity
  parent: BaseMobMegafauna
  id: MobHierophant
  name: hierophant
  description: A massive metal club that hangs in the air as though waiting. It'll make you dance to its beat.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.6,0.35,0.6"
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: "human"
  - type: LagCompensation
  - type: MobMover
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: RequireProjectileTarget
    active: False
  - type: CombatMode
  - type: MobState
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Wega/Mobs/Lavaland/hierophant.rsi
    state: hierophant
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: AmbientSound
    sound:
      path: "/Audio/_Wega/Mobs/Lavaland/hiero_bgm.ogg"
    enabled: false
    volume: 2
    range: 15
  - type: HierophantBoss
  - type: Megafauna
    bossMusic:
      path: "/Audio/_Wega/Mobs/Lavaland/hiero_bgm.ogg"
  - type: MegafaunaAwareness
    autoAggro: false
  - type: MegafaunaAttacks
  - type: TrophyHunter
    trophy: TrophyLavalandHierophantVortexTalisman
    dropChance: 1 # Guaranteed, since it's the boss
    collectSound:
      path: "/Audio/Effects/singularity_collapse.ogg" # More Cinema

- type: entity
  id: MobHierophantChaser
  name: hierophant chaser
  suffix: DO NOT MAP
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: HierophantChaser
#endregion

