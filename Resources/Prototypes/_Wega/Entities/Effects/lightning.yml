- type: entity
  name: ninja dash lightning
  id: LightningNinjaDash
  parent: BaseLightning
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: /Textures/_Wega/Effects/ninja_blink.rsi
      drawdepth: Effects
      layers:
        - state: "ninja_blink"
          color: "#65ff00"
          shader: unshaded
    - type: Electrified
      requirePower: false
      shockDamage: 0
    - type: Lightning
      canArc: false
    - type: PointLight
      enabled: true
      color: "#65ff00"
      radius: 2.5
      softness: 1
      autoRot: true
      castShadows: false
    - type: TimedDespawn
      lifetime: 1.5
