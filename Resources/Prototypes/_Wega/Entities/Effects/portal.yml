- type: entity
  id: PortalBsBanan
  name: banana portal
  components:
  - type: TimedDespawn
    lifetime: 0.1
  - type: Portal
  - type: Transform
    anchored: True
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false

- type: entity
  parent: BasePortal
  id: PortalShadekinFirst
  name: bluespace rift
  description: A bluespace rift, probably created by some Shadekin.
  components:
  - type: Appearance
  - type: Portal
    requiredCollisionTag: MobShadekin
    collisionBlacklist:
      components:
      - Vampire
      - ChangelingIdentity
    closedSpriteState: anom # placeholder
    openingSpriteState: pulse # placeholder
    openSpriteState: anom # placeholder
    closingSpriteState: pulse # placeholder
    arrivalSound:
      collection: Shadeskip
    departureSound:
      collection: Shadeskip
  - type: Sprite
    sprite: Structures/Specific/Anomalies/shadow_anom.rsi # placeholder
    layers:
    - state: anom # placeholder
      map: ["enum.PortalVisualLayers.Base"]
  - type: PointLight
    color: Purple

- type: entity
  parent: PortalShadekinFirst
  id: PortalShadekinSecond
