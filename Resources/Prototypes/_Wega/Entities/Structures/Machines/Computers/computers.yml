- type: entity
  parent: BaseComputerAiAccess
  id: DnaModifierConsole
  name: DNA-modifier console
  description: "This interface is used to change the structure of DNA."
  components:
  - type: DnaClient
  - type: DnaModifierConsole
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: ComputerVisuals
    stateScreen: dna
    stateKeys: rd_key
  - type: ActivatableUI
    singleUser: true
    key: enum.DnaModifierUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.DnaModifierUiKey.Key:
        type: DnaModifierBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: DnaModifierComputerCircuitboard
  - type: DeviceLinkSource
    range: 4
    ports:
    - MedicalScannerSender
  - type: AccessReader
    access: [["Research"]]
  - type: ContainerContainer
    containers:
      diskSlot: !type:ContainerSlot
      board: !type:Container
        ents: []
  - type: ItemSlots
    slots:
      diskSlot:
        whitelist:
          components:
          - DnaModifierDisk
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b53ca1"
  - type: GuideHelp
    guides:
    - Science

