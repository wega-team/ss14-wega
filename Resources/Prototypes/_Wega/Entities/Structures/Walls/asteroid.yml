# Veins
- type: entity
  abstract: true
  id: BaseVeinBananium
  suffix: Bananium
  description: An ore vein rich with bananium.
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreBananium
  - type: Sprite
    layers:
    - state: rock_bananium
      sprite: _Wega/Structures/Walls/stone-ore.rsi
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  abstract: true
  id: BaseVeinGems
  suffix: Gems
  description: An ore vein rich with gems.
  components:
  - type: OreVein
    oreChance: 1.0
    oreRarityPrototypeId: RandomGemsDistributionStandard
  - type: Sprite
    layers:
    - state: rock_gems
      sprite: _Wega/Structures/Walls/stone-ore.rsi
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  abstract: true
  id: BaseVeinMagmite
  suffix: Magmite
  description: An ore vein rich with magmite.
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreMagmite
  - type: Sprite
    layers:
    - state: rock_magmite
      sprite: _Wega/Structures/Walls/stone-ore.rsi
