- type: entity
  parent: BaseStructure
  id: BaseIcemoonCave
  name: cave
  description: "Well, it's not exactly wildlife, but it's a great source of it. Where do you think the cubs are born?!"
  suffix: DO NOT MAP
  abstract: true
  components:
  - type: Sprite
    sprite: _Wega/Structures/Specific/Lavaland/cave.rsi
    state: cave
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        mask:
        - MachineMask
        layer:
        - BulletImpassable
        - MidImpassable
        - LowImpassable
        density: 1000
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Wega/Effects/Planet/rumble.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 4
            max: 8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

