- type: entity
  id: BaseVeilCultStructure
  parent: BaseStructure
  abstract: true
  components:
  - type: Anchorable
    tool: VeilCultClockworkSlab
  - type: Physics
    bodyType: Dynamic
  - type: InteractionOutline
  # - type: BloodStructure
    # fixture: fix1
  # - type: UserInterface
  #   interfaces:
  #     enum.BloodStructureUiKey.Key:
  #       type: BloodStructureBoundUserInterface

- type: entity
  id: VeilCultBeacon
  parent: BaseVeilCultStructure
  name: beacon
  description: Ominous beacon of the Veil Cult.
  suffix: DO NOT MAP
  components:
  - type: Sprite
    sprite: _Wega/Structures/Specific/VeilCult/beacon.rsi
    state: beacon
  - type: Physics
    bodyType: Dynamic
  - type: VeilCultBeacon
  # - type: BloodStructure
  #   fixture: fix1
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass:
            min: 0
            max: 3  
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # - type: Construction
  #   graph: BloodCultStructurePylonGraph
  #   node: BloodCultStructurePylon

- type: entity
  id: VeilCultStructureAltar
  parent: BaseVeilCultStructure
  name: mechanical altar
  description: The altar of a certain god.
  suffix: DO NOT MAP
  components:
  - type: Sprite
    sprite: _Wega/Structures/Specific/VeilCult/altar.rsi
    state: altar
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer
  - type: PointLight
    radius: 1.1
    energy: 1
    color: "#a58b17"
  - type: UserInterface
    interfaces:
      enum.VeilAltarUiKey.Key:
        type: VeilAltarBoundUserInterface
  - type: VeilCultAltar