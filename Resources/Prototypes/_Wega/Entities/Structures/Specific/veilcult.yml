- type: entity
  id: VeilCultBeacon
  parent: BaseVeilCultStructure
  name: beacon
  description: Ominous beacon of the Veil Cult.
  suffix: DO NOT MAP
  components:
  - type: Anchorable
    tool: VeilCultClockworkSlab
  - type: Sprite
    sprite: _Wega/Structures/Specific/VeilCult/beacon.rsi
    state: beacon
  - type: Physics
    bodyType: Dynamic
  - type: VeilCultBeacon
  # - type: BloodStructure
  #   fixture: fix1
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass:
            min: 0
            max: 3  
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
