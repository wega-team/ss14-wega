- type: entity
  id: BaseVeilCultStructure
  parent: BaseStructure
  abstract: true
  components:
  - type: Anchorable
    tool: VeilCultClockworkSlab
  - type: Physics
    bodyType: Dynamic
  - type: InteractionOutline
  # - type: BloodStructure
    # fixture: fix1
