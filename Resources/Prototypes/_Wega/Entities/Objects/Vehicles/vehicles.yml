- type: entity
  parent: VehicleWheelchair
  id: VehicleWheelchairFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true

- type: entity
  parent: BaseVehicleStrap
  id: VehicleBoat
  name: goliath boat
  description: "A boat made of wood and goliath's skin. You need an oar to use it."
  components:
  - type: Sprite
    sprite: _Wega/Objects/Vehicles/boat.rsi
    drawdepth: Mobs
    state: boat
    noRot: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 5
            max: 10
          MaterialGoliathHide1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: Boat
  - type: Vehicle
  - type: MovementSpeedModifier
    baseAcceleration: 1
    baseFriction: 1
    baseWalkSpeed: 4.5
    baseSprintSpeed: 7
  - type: Construction
    graph: VehicleBoat
    node: goliath_boat

- type: entity
  parent: VehicleBoat
  id: VehicleDragonBoat
  name: dragon boat
  description: "A mysterious vessel that can glide effortlessly through molten lava. It requires no oars and seems to move of its own accord."
  components:
  - type: Sprite
    state: dragon_boat
  - type: Boat
    requiredOal: false

- type: entity
  parent: VehicleBoat
  id: VehicleBoatPolar
  name: polar boat
  description: "A boat crafted from wood and polar bear hide. It feels surprisingly warm and resilient against the cold."
  components:
  - type: Sprite
    state: ice_boat
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 5
            max: 10
          MaterialPolarBearHide1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: Construction
    graph: VehicleBoat
    node: polar_boat
