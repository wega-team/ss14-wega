- type: entity
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseSyndicateContraband]
  id: WeaponEngigun
  name: Engigun
  description: An obscure modification of the Enforcer, fitted with an experimental muffler. Great for those with a strict moral code. Uses .50 shotgun shells.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Shotguns/engigun.rsi
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Guns/Shotguns/engigun.rsi
  - type: Item
    sprite: _Wega/Objects/Weapons/Guns/Shotguns/engigun.rsi 
    shape:
    - 0,0,3,0 # smaller than BaseShotgun by 1 tile
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Metal
    capacity: 4
    proto: BatteryBullet
    container: ballistic-ammo
    cycleable: false
  - type: GunRequiresWield
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/hushpup.ogg
      params:
        volume: -3
        rolloffFactor: 1.3
    fireRate: 2
  - type: GunSpreadModifier
    spread: 1.2
  - type: BallisticAmmoSelfRefiller
    autoRefillRate: 9s
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []