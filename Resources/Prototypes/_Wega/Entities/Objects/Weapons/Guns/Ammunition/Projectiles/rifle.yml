- type: entity
  id: BulletLightRifleFrozen
  name: bullet (.30 rifle frozen)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 10
        Cold: 3
  - type: StunOnCollide
    slowdownAmount: 0.75
    walkSpeedModifier: 0.6
    sprintSpeedModifier: 0.6

