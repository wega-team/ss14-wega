# Empty mags
- type: entity
  id: BaseExtMagazineRifle
  name: extented rifle magazine (.30)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - ExtMagazineRifle
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeLightRifle
    capacity: 45
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/ext_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Magazines
- type: entity
  id: ExtMagazineRifle
  name: extented rifle magazine (.30)
  description: Extented rifle magazine for .30 with a capacity of 45. Intended to hold general-purpose kinetic ammunition.
  parent: BaseExtMagazineRifle
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifle
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseExtMagazineRifle
  id: ExtMagazineRifleFrozen
  name: extented riffle magazine (.30 rifle frozen)
  description: Extented rifle magazine for .30 with a capacity of 45. Intended to hold experimental chilling ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleFrozen
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#18a2d5ff"
