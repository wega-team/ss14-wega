- type: entity
  parent: BaseWeaponRifle
  id: WeaponRifleXC67
  name: assault riffle xC-67
  description: A prototype of a new assault rifle from the creators of the famous C-20r. Uses the .30 cartridge. Advanced ergonomics allow for excellent shooting accuracy.
  suffix: Rifles
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Rifles/xc67.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Guns/Rifles/xc67.rsi
  - type: Gun
    fireRate: 6.5
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ltrifle.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ExtMagazineRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifle
            - ExtMagazineRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  name: jay
  parent: BaseWeaponRifle
  id: WeaponRifleJay
  description: Automatic assault rifle military class.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Rifles/jay.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Guns/Rifles/jay.rsi
  - type: Item
    size: Large
  - type: GunWieldBonus
    minAngle: -14
    maxAngle: -29
  - type: Gun
    burstFireRate: 7.0
    burstCooldown: 1.1
    shotsPerBurst: 7
    minAngle: 15
    maxAngle: 30
    angleIncrease: 2.5
    angleDecay: 2.5
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    - Burst
    fireRate: 5.8
    projectileSpeed: 40
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  name: m90-sm
  parent: [BaseItem, BaseSyndicateContraband]
  id: WeaponSubMachineMG90
  description: An automatic magazine-fed shotgun for close-quarters combat. Kicks like a mule on steroids. Uses .50 shotgun shells.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Rifles/m-90gl.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Guns/Rifles/m-90gl.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/atreides.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: ItemSlots
    disableSmartEquipEject: true # Corvax-Wega-Add
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGun
        priority: 2
        whitelist:
          tags:
          - MagazinePistolSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      hotswap-paired: !type:Container
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: WeaponHotswap
    alternateForm: WeaponLauncherMG90
    isAlternate: false
  - type: Appearance
  - type: StaticPrice
    price: 5000

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: WeaponLauncherMG90
  categories: [ HideSpawnMenu ]
  name: m90-lm
  description: PLOOP.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Rifles/m-90gl.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
      hotswap-paired: !type:Container
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Guns/Rifles/m-90gl.rsi
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Grenade
    capacity: 1
    proto: GrenadeFrag
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: Gun
    fireRate: 1
    projectileSpeed: 25 # Slower than a bullet, same speed as our old projectile limit.
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
  - type: WeaponHotswap
    alternateForm: WeaponSubMachineMG90
    isAlternate: true
  - type: StaticPrice
    price: 10000