- type: entity
  parent: BaseBullet
  id: ProjectileBloodBolt
  name: ""
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: blood_bolt
  - type: Projectile
    damage:
      types:
        Blunt: 15

- type: entity
  parent: BaseBullet
  id: BulletMagmaCharge
  name: charge bolt
  description: Marks a target for additional damage.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: _Wega/Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
      - state: magmabolt
        shader: unshaded
  - type: DamageMarkerOnCollide
    whitelist:
      components:
        - MobState
    damage:
      types:
        Blunt: 20
        Slash: 5
  - type: GatheringProjectile
    amount: 4
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 0
        Structural: 50
  - type: TimedDespawn
    lifetime: 0.4

- type: entity
  parent: BaseBullet
