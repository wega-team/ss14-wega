- type: entity
  parent: WeaponCrusher
  id: WeaponMagmiteCrusher
  name: magmite crusher
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher.rsi
    layers:
    - state: icon
    - state: icon-uncharged
      visible: false
      map: [ "empty-icon" ]
  - type: Item
    size: Ginormous
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher.rsi
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -4
        Slash: -4
        Piercing: -4
  - type: PointLight
    color: "#df7126"
  - type: BasicEntityAmmoProvider
    proto: BulletMagmaCharge
    capacity: 1
    count: 1
  - type: MeleeWeapon
    attackRate: 1.5
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Slash: 6
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Slash: 5
        Structural: 60
  - type: StaticPrice
    price: 2850

