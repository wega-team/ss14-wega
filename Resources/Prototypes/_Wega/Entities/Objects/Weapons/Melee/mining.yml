- type: entity
  parent: WeaponCrusher
  id: WeaponMagmiteCrusher
  name: magmite crusher
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher.rsi
    layers:
    - state: icon
    - state: icon-uncharged
      visible: false
      map: [ "empty-icon" ]
  - type: Item
    size: Ginormous
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher.rsi
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -4
        Slash: -4
        Piercing: -4
  - type: PointLight
    color: "#df7126"
  - type: BasicEntityAmmoProvider
    proto: BulletMagmaCharge
    capacity: 1
    count: 1
  - type: MeleeWeapon
    attackRate: 1.5
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Slash: 6
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Slash: 5
        Structural: 60
  - type: StaticPrice
    price: 2850

- type: entity
  parent: WeaponMagmiteCrusher
  id: WeaponMagmiteCrusherGlaive
  name: crusher glaive
  description: An early design of the proto-kinetic accelerator, in glaive form.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher_glaive.rsi
  - type: Item
    size: Ginormous
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher_glaive.rsi
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Melee/magmitecrusher_glaive.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: UseDelay
    delay: 1.9
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -6
        Slash: -6
        Piercing: -6
  - type: MeleeWeapon
  - type: Tag
    tags:
      - Pickaxe
  - type: StaticPrice
    price: 2850

- type: entity
  parent: WeaponCrusher
  id: WeaponCrusherHarpoon
  name: harpoon-crusher
  description: A handy harpoon for stabbing attacks.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/harpoon.rsi
    state: icon
  - type: Item
    sprite: _Wega/Objects/Weapons/Melee/harpoon.rsi
    size: Ginormous
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Melee/harpoon.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: UseDelay
    delay: 1.5
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -2
        Slash: -2
        Piercing: -2
  - type: MeleeWeapon
    animation: WeaponArcThrust
    attackRate: 2
    wideAnimationRotation: -135
    angle: 0
    damage:
      types:
        Piercing: 8
        Blunt: 1
        Slash: 1
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 25
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Pickaxe
    - Spear

- type: entity
  parent: WeaponCrusher
  id: WeaponCrusherSword
  name: sword-crusher
  description: A cutting sword for convenient attacks.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/sword.rsi
    state: icon
  - type: Item
    sprite: _Wega/Objects/Weapons/Melee/sword.rsi
    size: Ginormous
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Melee/sword.rsi
  - type: MeleeWeapon
    attackRate: 2
    wideAnimationRotation: -1
    damage:
      types:
        Blunt: 1
        Slash: 8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: UseDelay
    delay: 1.8
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -2
        Slash: -2
        Piercing: -2
  - type: Reflect # sword-cool
    reflectProb: 0.1
    reflects:
    - NonEnergy
    slotFlags:
    - NONE

- type: entity
  parent: WeaponCrusherDagger
  id: WeaponDaggerCrusher
  name: dagger-crusher
  description: It's small, sharp, and very dangerous.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/dagger.rsi
    state: icon
  - type: Item
    storedRotation: -45
    size: Small
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Melee/dagger.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: WeaponHotswap
    alternateForm: WeaponCrusherBlaster
    isAlternate: false
  - type: UseDelay
    delay: 0.5
  - type: TrophyHuntingTool
  - type: UpgradeableCrusher
    whitelist:
      tags:
      - CrusherUpgrade
  - type: ContainerContainer
    containers:
      crusher_upgrades: !type:Container
      hotswap-paired: !type:Container
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -2
        Slash: -2
        Piercing: -2

- type: entity
  parent: BaseItem
  id: WeaponCrusherBlaster
  name: blaster-crusher
  description: "A blaster that shoots kinetic energy."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Pistols/blaster.rsi
    state: icon
  - type: Item
    storedRotation: -90
    size: Small
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Guns/Pistols/blaster.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: WeaponHotswap
    alternateForm: WeaponDaggerCrusher
    isAlternate: true
  - type: UseDelay
    delay: 0.5
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: AmmoCounter
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.75
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletKineticCrusher
    capacity: 1
    count: 1
  - type: UpgradeableGun
    whitelist:
      tags:
      - PKAUpgrade
  - type: ContainerContainer
    containers:
      upgrades: !type:Container
      hotswap-paired: !type:Container

- type: entity
  parent: BaseItem
  id: Jackhammer
  name: sonic jackhammer
  description: Cracks rocks with sonic blasts.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Melee/jackhammer.rsi
    state: icon
  - type: Clothing
    sprite: _Wega/Objects/Weapons/Melee/jackhammer.rsi
    slots:
    - Belt
  - type: Item
    storedRotation: -90
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/_Wega/Items/sonic_jackhammer.ogg"
    attackRate: 6
    damage:
      types:
        Blunt: 3
        Structural: 15
  - type: Tag
    tags:
    - Pickaxe

- type: entity
  parent: Jackhammer
  id: JackhammerFrostMiner
  categories: [ HideSpawnMenu ]
  components:
  - type: DeleteOnDrop
  - type: DisarmMalus
    malus: 1
