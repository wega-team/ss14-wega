- type: entity
  parent: Holoprojector
  id: HoloprojectorSex
  name: holobarrier projector
  description: Creates a solid but fragile holographic barrier.
  components:
    - type: HolosignProjector
      signProto: HolosignSex
      chargeUse: 120
    - type: Sprite
      sprite: _Wega/Objects/Devices/Holoprojectors/sex.rsi
      state: icon
    - type: Tag
      tags:
        - HolofanProjector
    - type: StaticPrice
      price: 50

- type: entity
  parent: HoloprojectorSex
  id: HoloprojectorSexEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  parent: HoloprojectorField
  id: SyndiHoloprojectorField
  name: force field projector
  description: Creates an impassable forcefield that won't let anything through. Close proximity may or may not cause cancer.
  components:
    - type: Item
      size: Small
    - type: HolosignProjector
      signProto: SyndiHolosignForcefield
      chargeUse: 240
    - type: Sprite
      sprite: _Wega/Objects/Devices/Holoprojectors/field.rsi
      state: icon
    - type: Tag
      tags:
        - HolofanProjector
    - type: ItemSlots
      disableSmartEquipEject: true
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellMicroreactor
          disableEject: true
          swap: false

- type: entity
  parent: HoloprojectorField
  id: CargoHoloprojectorField
  name: holocreate projector
  description: Creates an impassable forcefield that won't let anything through. Close proximity may or may not cause cancer.
  components:
    - type: Item
      size: Small
    - type: HolosignProjector
      signProto: HoloCreate
      chargeUse: 720
      anchor: false
    - type: Sprite
      sprite: _Wega/Objects/Devices/Holoprojectors/cargo.rsi
      state: icon
    - type: Tag
