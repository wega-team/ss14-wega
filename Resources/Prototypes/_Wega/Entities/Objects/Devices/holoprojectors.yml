          disableEject: true
          swap: false
          
- type: entity
  parent: HoloprojectorField
  id: MedicaloloprojectorField
  name: medical projector
  description: Creates an impassable forcefield that won't let anything through. Close proximity may or may not cause cancer.
  components:
    - type: Sterile
      alwaysSterile: true
    - type: BodyScannerConsole
    - type: ActivatableUI
      key: enum.BodyScannerUiKey.Key
    - type: UserInterface
      interfaces:
        enum.BodyScannerUiKey.Key:
          type: BodyScannerBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
    - type: DeviceLinkSource
      range: 2
      ports:
        - SurgeryTableSender
    - type: Item
      size: Small
    - type: HolosignProjector
      signProto: HoloOperatingTable
      chargeUse: 720
      anchor: false
    - type: Sprite
      sprite: _Wega/Objects/Devices/Holoprojectors/medical.rsi
      state: icon
    - type: Tag
      tags:
        - HolofanProjector
    - type: ItemSlots
      disableSmartEquipEject: true
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellMicroreactor
          disableEject: true
          swap: false
