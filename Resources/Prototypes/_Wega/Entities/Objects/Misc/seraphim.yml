- type: entity
  parent: BaseSubdermalImplant
  id: SeraphimImplant
  suffix: "Wega, BSO"
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/seraphim_implanter.rsi
    state: icon
  - type: SubdermalImplant
    permanent: true
    implantComponents:
    - type: SeraphimMarkVisual
    - type: SeraphimImplant

- type: entity
  parent: BaseItem
  id: SeraphimAutoImplanter
  suffix: "Wega, BSO"
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/seraphim_implanter.rsi
    layers:
    - state: icon
      map: ["icon"]
    - state: empty
      visible: false
      map: ["empty"]
  - type: Item
    size: Ginormous
  - type: SeraphimImplanter
  - type: Strap
    position: Down
    rotation: -90
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SeraphimImplanterVisuals.Empty:
        icon:
          True: { visible: false }
          False: { visible: true }
        empty:
          True: { visible: true }
          False: { visible: false }
