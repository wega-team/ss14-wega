- type: entity
  id: EmptySubdermalImplant
  parent: BaseItem # Corvax-Wega-Surgery
  name: empty implant
  description: A microscopic chip that's injected under the skin.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Medical/Surgery/implants.rsi
    state: empty
  - type: Item # Corvax-Wega-Surgery
    size: Tiny # Corvax-Wega-Surgery

- type: entity
  parent: BaseSubdermalImplant
  id: BluespaceLifelineImplant
  name: bluespace lifeline implant
  description: Teleports the hosts body to Central Command on activation. They will not be able to return.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Medical/Surgery/implants.rsi
    state: nt
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateBluespaceLifeline
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: AddComponentsOnTrigger # make them embed into the target, but only when activated so that they can't be metagamed
    targetUser: true
    components:
    - type: TimedDespawn
      lifetime: 0
  - type: SpawnOnTrigger
    proto: BluespaceLifeline
    predicted: true
  - type: Tag
    tags:
    - SubdermalImplant

- type: entity
  parent: BaseSubdermalImplant
  id: LoyaltyImplant
  name: loyalty implant
  description: This implant binds the user's mind to the will of the person who implanted it.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Medical/Surgery/implants.rsi
    state: empty
  - type: MindControlImplant
  - type: Tag
    tags:
    - SubdermalHeadImplant

- type: entity
  parent: BaseSubdermalImplant
  id: ThermalVisionImplant
  name: thermal vision implant
  description: This implant lets the user see the heat signatures of living creatures through walls and darkness.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Medical/Surgery/implants.rsi
    state: syndicate
  - type: SubdermalImplant
  - type: ThermalVisionImplant
  - type: Tag
    tags:
    - SubdermalImplant

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: ThermalVisionImplanter
  name: thermal vision implanter
  description: Implants thermal vision, letting the user see living creatures through walls and darkness.
  components:
  - type: Implanter
    implant: ThermalVisionImplant

- type: entity
  parent: BaseSubdermalImplant
  id: SmokeImplant
  name: smoke implant
  description: This implant releases smoke clouds.
  components:
    - type: Sprite
      sprite: _Wega/Objects/Specific/Medical/Surgery/implants.rsi
      state: syndicate
    - type: SubdermalImplant
      implantAction: ActionActivateSmoke
    - type: TriggerOnActivateImplant
    - type: EmitSoundOnTrigger
      sound: /Audio/Effects/smoke.ogg
    - type: SmokeOnTrigger
      spreadAmount: 20
      duration: 10
