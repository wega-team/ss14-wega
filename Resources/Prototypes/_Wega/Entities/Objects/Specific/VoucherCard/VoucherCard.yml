- type: entity
  parent: BaseItem
  id: BaseVoucherCard
  abstract: true
  components:
  - type: ActivatableUI
    key: enum.VoucherUiKey.Key
  - type: UserInterface
    interfaces:
      enum.VoucherUiKey.Key:
        type: VoucherBoundUserInterface
        
