- type: entity
  parent: BaseItem
  id: LegionCore
  name: legion core
  description: "A mysterious core filled with some kind of energy. Does it seem to be fading away?"
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Lavaland/legioncore.rsi
    layers:
    - state: icon_active
      map: [ "enum.VisualLayers.Layer" ]
  - type: Item
    size: Small
  - type: Damageable
  - type: Injurable
    damageContainer: Clothing
  - type: Reactive
    groups:
      Special: [ Touch ]
  - type: LegionCore
    healAmount:
      types:
        Blunt: -25
        Heat: -25
    internals:
    - ArterialBleeding
    - ClosedFracture
    - OpenFracture
  - type: Appearance
  - type: GenericVisualizer
    visuals:
     enum.VisualLayers.Enabled:
        enum.VisualLayers.Layer:
          True: {state: icon_active}
          False: {state: icon_base}
  - type: StaticPrice
    price: 250

