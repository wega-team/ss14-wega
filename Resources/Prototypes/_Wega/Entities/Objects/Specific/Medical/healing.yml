# Corvax-Wega-Android-start
- type: entity
  name: "tyrium pack"
  description: "Extremely important liquid for android functioning."
  parent: BaseHealingItem
  id: Tyriumpack
  suffix: Full
  components:
  - type: Tag
    tags:
    - Bloodpack
  - type: Sprite
    sprite: _Wega/Objects/Specific/Medical/tyriumpack.rsi
    state: tyriumpack
  - type: Healing
    bloodlossModifier: -20
    modifyBloodLevel: 40
    damageContainers:
      - Android
    damage:
      types:
        Bloodloss: -5
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: Tyriumpack
    count: 10
  - type: StackPrice
    price: 10

- type: entity
  parent: Tyriumpack
  id: Tyriumpack1
  suffix: Single
  components:
  - type: Stack
    stackType: Tyriumpack
    count: 1

- type: entity
  parent: Tyriumpack
  id: Tyriumpack3
  suffix: 3
  components:
  - type: Stack
    stackType: Tyriumpack
    count: 3

- type: entity
  name: nanopasta
  description: "Extremely important liquid for android functioning."
  parent: BaseHealingItem
  id: Nanopast
  suffix: Full
  components:
  - type: Tag
    tags:
    - Ointment
    - Brutepack
    - Nanopast
  - type: Sprite
    sprite: _Wega/Objects/Specific/Medical/nanopasta.rsi
    layers:
    - map: ["base"]
      state: nanopasta-3
  - type: Appearance
  - type: Item
    sprite: _Wega/Objects/Specific/Medical/nanopasta.rsi
    heldPrefix: null
  - type: Healing
    delay: 1.25
    selfHealPenaltyMultiplier: 3
    damageContainers:
      - Android
      - Silicon
    bloodlossModifier: -10 # Tourniquets stop bleeding
    damage:
      types:
        Blunt: -10
        Slash: -10
        Piercing: -10
        Heat: -10
        Shock: -10
    healingBeginSound:
      path: "/Audio/Effects/packetrip.ogg"
    healingEndSound:
      path: "/Audio/Items/squeezebottle.ogg"
  - type: Stack
    stackType: Nanopast
    count: 5
    baseLayer: base
    layerStates:
    - nanopasta-1
    - nanopasta-2
    - nanopasta-3
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [1, 3, 5]
  - type: StackPrice
    price: 40

- type: entity
  parent: Nanopast
  id: Nanopast1
  suffix: Single
  components:
  - type: Stack
    stackType: Nanopast
    count: 1
# Corvax-Wega-Android-end
