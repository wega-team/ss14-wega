    maxCharge: 1200
    startingCharge: 1200
  - type: BatterySelfRecharger
    autoRechargeRate: 40
  - type: AmmoCounter

# SEC Dec
- type: entity
  parent: BaseSecurityPDA
  categories: [ HideSpawnMenu ]
  id: DetectivePDABorg
  name: borg sec PDA
  description: Smells like rain... pouring down the rooftops...
  components:
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-detective
  - type: PdaBorderColor
    borderColor: "#774705"
  - type: Icon
    state: pda-detective
  - type: EntityTableContainerFill
    containers:
      preinstalled-program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NanoTaskCartridge
        - id: NewsReaderCartridge
        - id: NanoChatCartridge
        - id: WantedListCartridge
        - id: LogProbeCartridge

# SEC Granader
- type: entity
  name: hand grenade gun
  parent: BaseItem
  id: WeaponHandGranadeGun
  description: Load granade for optimal results.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Battery/borggun.rsi
    layers:
    - state: icon
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Effects/thunk.ogg
    soundEmpty:
      path: /Audio/Items/hiss.ogg
  - type: Appearance
  - type: BatteryAmmoProvider
    proto: GrenadeStingerProject
    fireCost: 500
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 25
    autoRechargePauseTime: 20
  - type: AmmoCounter
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: GrenadeStingerProject
      fireCost: 500
    - proto: GrenadeFlashBangProject
      fireCost: 250
    - proto: TearGasGrenadeProject
      fireCost: 500

- type: entity
  name: box granade
  parent: BoxCardboard
  id: BoxBorgGranade
  description: A box full of pill canisters.
  components:
  - type: Sprite
    layers:
      - state: box_of_doom # Corvax-Resprite
      - state: flashbang
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,4,3

# SEC Sheild
- type: entity
  name: telescopic shield borg
  parent: [  BaseItem, BaseSecurityContraband ]
  id: TelescopicShieldBorg
  description: It s nanomachine, son!
  components:
    - type: Sprite
      sprite: Objects/Weapons/Melee/teleriot_shield.rsi
      state: teleriot-on
    - type: Item
      sprite: Objects/Weapons/Melee/teleriot_shield.rsi
      heldPrefix: teleriot
    - type: Blocking
      activeBlockFraction: 0.0
      passiveBlockFraction: 0.0
      passiveBlockModifier:
        flatReductions:
          Blunt: 500
          Piercing: 500
          Slash: 500
          Heat: 500
          Cellular: 500
          Caustic: 500
          Cold: 500
          Radiation: 500
          Shock: 500
          Poison: 500
      
- type: entity
  name: Bullet shield borg
  parent: TelescopicShieldBorg
  id: BulletShieldBorg
  description: It s nanomachine, son!
  components:
