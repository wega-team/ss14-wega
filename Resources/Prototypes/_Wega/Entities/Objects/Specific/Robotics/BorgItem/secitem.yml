# Sec Rare
- type: entity
  name: turel laser pistol
  parent: BaseItem
  id: WeaponBorgTurel
  description: Better pray it won't burn your hands off.
  components:
  - type: Wieldable
  - type: GunRequiresWield
  - type: Gun
    fireRate: 5
    selectedMode: Fullauto
    availableModes:
    - Fullauto
    angleDecay: 0
    minAngle: 0
    maxAngle: 0
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_svalinn.ogg
      params:
        variation: 0.05
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Battery/borggun.rsi
    layers:
    - state: icon
  - type: Item
    sprite: _Wega/Objects/Weapons/Guns/Battery/borggun.rsi
    storedOffset: 0,-4
  - type: Appearance
  - type: BatteryAmmoProvider
    proto: RedLightLaser
    fireCost: 50
  - type: Battery
    maxCharge: 2500
    startingCharge: 0
  - type: BatterySelfRecharger
    autoRechargeRate: 50
    autoRechargePauseTime: 10
  - type: AmmoCounter
  - type: SpeedModifiedOnWield
    walkModifier: 0.1
    sprintModifier: 0.1
  - type: CursorOffsetRequiresWield
  - type: Unremoveable
  - type: ItemSelector
    items:
    - WeaponBorgTurel
    - WeaponBorgDeathGun
  - type: ActivatableUI
    key: enum.ItemSelectorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ItemSelectorUiKey.Key:
        type: ItemSelectorBoundUserInterface
  - type: Tag
    tags:
    - Itemborg

