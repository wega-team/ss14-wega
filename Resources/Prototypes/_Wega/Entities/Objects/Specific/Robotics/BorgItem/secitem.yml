# Security module
- type: entity
  parent: HoloprojectorSecurity
  id: HoloprojectorSecurityMicrowave
  suffix: PowerCellMicroreactor
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false

- type: entity
  name: makeshift disabler pistol
  parent: BaseItem
  id: WeaponBorgDisabler
  description: Better pray it won't burn your hands off.
  components:
  - type: Gun
    fireRate: 4.5
    selectedMode: Fullauto
    availableModes:
    - Fullauto
    angleDecay: 0
    minAngle: 0
    maxAngle: 0
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: Item
    sprite: _Wega/Objects/Weapons/Guns/Battery/borggun.rsi
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Battery/borggun.rsi
    layers:
    - state: icon
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: BatteryAmmoProvider
    proto: BulletDisablerSmg
    fireCost: 40
  - type: BatterySelfRecharger
    autoRechargeRate: 20
  - type: AmmoCounter
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisablerSmg
      fireCost: 40
    - proto: BulletTaserBorg
      fireCost: 600


- type: entity
  parent: WeaponMeleeNeedle
  id: WeaponMeleeNeedleBorgSec
  name: security damage stick
  description: A specialty weapon used in the destruction of unique syndicate morale-boosting equipment.
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 15
    bluntStaminaDamageFactor: 2.5
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 0

# SEC Lethal
- type: entity
  name: makeshift laser pistol
  parent: BaseItem
  id: WeaponBorgLethal
  description: Better pray it won't burn your hands off.
  components:
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    angleDecay: 0
    minAngle: 0
    maxAngle: 0
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Battery/borggun.rsi
    layers:
    - state: icon
  - type: Item
    sprite: _Wega/Objects/Weapons/Guns/Battery/borggun.rsi
    storedOffset: 0,-4
  - type: Appearance
  - type: BatteryAmmoProvider
    proto: RedMediumLaser
    fireCost: 100
