- type: entity
  parent: FlaskBase
  id: DrinkUnholyFlask
  name: old flask
  description: "Covered with a layer of dust."
  components:
  - type: Sprite
    sprite: _Wega/Objects/Consumable/Drinks/unholyflask.rsi
    state: icon
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon"} # lid off
          False: {state: "icon"} # lid on

- type: entity
  parent: DrinkUnholyFlask
  id: DrinkUnholyFlaskFull
  suffix: Full
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Unholywater
        Quantity: 60

- type: entity
  parent: DrinkShaker
  id: DrinkShakerSyndi
  name: syndi-shaker
  description: A high-strength and explosion-proof shaker with increased capacity in the Syndicate's signature color scheme.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Consumable/Drinks/shaker_syndi.rsi
  - type: Item
    sprite: _Wega/Objects/Consumable/Drinks/shaker_syndi.rsi
  - type: Solution
    solution:
      maxVol: 240
  - type: ExplosionResistance
    damageCoefficient: 0
