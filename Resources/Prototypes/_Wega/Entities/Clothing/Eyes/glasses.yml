- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesGlassesNightVision
  name: night vision goggles
  description: a pair of goggles that allows you to see through dark.
  components:
  - type: Sprite
    sprite: _Wega/Clothing/Eyes/nightvision.rsi
    layers:
    - state: icon-off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _Wega/Clothing/Eyes/nightvision.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IdentityBlocker
    coverage: EYES
  - type: NightVision
    tint: "#00800000"
    wattage: 3
    activateSound: /Audio/_Wega/Items/activate.ogg
    deactivateSound: /Audio/_Wega/Items/deactivate.ogg
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: "icon" }
          False: { state: "icon-off" }

