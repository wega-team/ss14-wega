- type: entity
  parent: [SolutionFood, SolutionToolSmall, Clothing, BaseSlicingRefinable]
  id: ClothingUnderBottomBase
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    equipDelay: 2
    unequipDelay: 2
    quickEquip: false
    slots:
    - underwearbottom
  - type: Item
    size: Small
  - type: Storage
    grid:
    - 0,0,0,1
    maxItemSize: Tiny
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
      amount: 2
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 10

