- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: UnsensoredClothingUniformToggleableBase
  components:
  - type: ToggleableSpriteClothing
    defaultSuffix: "-down"

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformSkirtBase
  id: UnsensoredClothingUniformSkirtToggleableBase
  components:
  - type: ToggleableSpriteClothing
    defaultSuffix: "-down"

- type: entity
  abstract: true
  parent: [ ClothingUniformBase, UnsensoredClothingUniformToggleableBase ]
  id: ClothingUniformToggleableBase

- type: entity
  abstract: true
  parent: [ ClothingUniformSkirtBase, UnsensoredClothingUniformSkirtToggleableBase ]
  id: ClothingUniformSkirtToggleableBase

- type: entity
  abstract: true
  id: ClothingSecurityUniformBase
  components:
  - type: SuitSensor
    randomMode: false
    mode: SensorCords

- type: entity
  abstract: true
  id: BaseUpgradableClothingUniform
  components:
  - type: UpgradeableClothing
    whitelist:
      tags:
        - UniformUpgrade
