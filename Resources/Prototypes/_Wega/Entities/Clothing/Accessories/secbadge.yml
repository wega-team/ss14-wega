- type: entity
  parent: BaseItem
  abstract: true
  id: BaseBadgeSec
  name: badge
  components:
  - type: Item
    size: Tiny
  - type: ClothingUpgrade
    tags: [ Badge ]
  - type: RedescribeOnInteract
    isDescIn: true
    nameTitleLocString: renameable-component-rename-action-badge
    redescribeActionLocString: renameable-component-name-field-badge
  - type: ClothingAccessoriesProtection
    modifiers:
      coefficients:
        Piercing: 0.95
        Heat: 0.95
  - type: Tag
    tags:
    - UniformUpgrade
    - Badge
  - type: StealTarget
    stealGroup: BadgeSec

