- type: entity
  parent: ClothingOuterBaseLarge
  id: ClothingOuterArmorTemplar
  name: templar armor
  description: "Straight from the Middle Ages, to eradicate heresy."
  components:
  - type: Sprite
    sprite: _Wega/Clothing/OuterClothing/Armor/templar.rsi
  - type: Clothing
    sprite: _Wega/Clothing/OuterClothing/Armor/templar.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.5

- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing]
  id: ClothingOuterArmorBlueShield
  name: officer bulletproof "Blue Shield"
  description: A standard armored breastplate that provides protection and at the same time a certain mobility. The blue and white Blue Shield emblem is on the chest.
  components:
    - type: Sprite
      sprite: _Wega/Clothing/OuterClothing/Armor/blueshield.rsi
    - type: Clothing
      sprite: _Wega/Clothing/OuterClothing/Armor/blueshield.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.5
          Slash: 0.5
          Piercing: 0.6
          Heat: 0.5
    - type: ExplosionResistance
      damageCoefficient: 0.65
    - type: ClothingSpeedModifier
      walkModifier: 1.0
      sprintModifier: 1.0
    - type: HeldSpeedModifier

- type: entity
  parent: ClothingOuterArmorCaptainCarapace
  id: ClothingOuterArmorSherifCarapace
  name: sherif's carapace
  description: An armored chestpiece that provides protection whilst still offering maximum mobility and flexibility. Issued only to the station's finest.
  components:
  - type: Sprite
    sprite: _Wega/Clothing/OuterClothing/Armor/captain_carapace_green.rsi
  - type: Clothing
    sprite: _Wega/Clothing/OuterClothing/Armor/captain_carapace_green.rsi

- type: entity
  parent: ClothingOuterArmorCaptainCarapace
  id: ClothingOuterArmorCaptainCarapaceWhite
  name: white capitan's carapace
  description: An armored chestpiece that provides protection whilst still offering maximum mobility and flexibility. Issued only to the station's finest.
  components:
  - type: Sprite
    sprite: _Wega/Clothing/OuterClothing/Armor/captain_carapace_white.rsi
  - type: Clothing
    sprite: _Wega/Clothing/OuterClothing/Armor/captain_carapace_white.rsi

- type: entity
  parent: [ ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseCargoContraband ]
  id: ClothingOuterArmorExplorerSuit
  name: explorer suit
  description: An armoured suit for exploring harsh environments.
  components:
  - type: Sprite
    sprite: _Wega/Clothing/OuterClothing/Armor/explorer_suit.rsi
    state: icon
  - type: Clothing
    sprite: _Wega/Clothing/OuterClothing/Armor/explorer_suit.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.65
        Heat: 0.6
        Caustic: 0.6
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodExplorer
  # - type: Construction
  #   graph: ExplorerSuit
  #   node: start
  - type: FireProtection
    reduction: 0.4
  - type: Dirtable
    dirtState: explorersuit
    equippedDirtState: equipped-explorersuit

- type: entity
  parent: ClothingOuterArmorExplorerSuit
  id: ClothingOuterArmorExplorerSuitBDM
  categories: [ HideSpawnMenu ]
  components:
  - type: Unremoveable
  - type: DeleteOnDrop
  - type: SpawnOnDelete
    prototype: ClothingOuterArmorExplorerSuit
  - type: Dirtable
    currentDirtLevel: 100
    dirtColor: "#880000"
