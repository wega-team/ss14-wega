- type: reagent
  id: Shrimp
  name: reagent-name-shrimp
  group: Foods
  desc: reagent-desc-shrimp
  physicalDesc: reagent-physical-desc-opaque
  flavor: shrimp
  color: "#24591F"
  metabolisms:
    Bloodstream:
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        time: 5
        type: Add
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Ariral ]
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.05
        sprintSpeedModifier: 1.05
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Ariral ]
      - !type:Jitter
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Ariral ]
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Hunger
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vampire ]
          inverted: true
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vampire ]
          inverted: true
        reagent: UncookedAnimalProteins
        amount: 0.5
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 1.5
  - !type:PlantAdjustHealth
    amount: 0.75
  pricePerUnit: 2

- type: reagent
  parent: Shrimp
  id: CookedShrimp
  name: reagent-name-cooked-shrimp
  desc: reagent-desc-cooked-shrimp
  color: "#102e0d"
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Hunger
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vampire ]
          inverted: true
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vampire ]
          inverted: true
        reagent: Protein
        amount: 0.5
