- type: entity
  parent: [BaseItem, BaseMinorContraband]
  id: ThrowingStar
  name: throwing star
  description: An ancient weapon still used to this day, due to its ease of lodging itself into its victim's body parts.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Throwable/throwing_star.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: Appearance
  - type: HolidayVisuals
    holidays:
      festive:
      - FestiveSeason
  - type: GenericVisualizer
    visuals:
      enum.HolidayVisuals.Holiday:
        base:
          festive: { state: festive }
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 8
        Piercing: 10
  - type: StaminaDamageOnCollide
    damage: 45
  - type: StaminaDamageOnEmbed
    damage: 10

- type: entity
  parent: ThrowingStar
  id: ThrowingStarNinja
  name: ninja throwing star
  components:
  # prevent ninja crashing server + filling bag with 20 stars to instakill a single person
  # also limits the crew's use
  - type: TimedDespawn
    lifetime: 30
  - type: NinjaShuriken

- type: entity
  parent: BaseItem
  id: ChainKunaiNinja
  name: chain kunai
  description: A kunai attached to a chain. Used to pull targets toward you.
  categories: [ DoNotMap ]
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Throwable/kunai.rsi
    layers:
    - state: icon
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.10,0.10,0.10"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    damage:
      types:
        Piercing: 5
  - type: ChainKunaiProjectile
  - type: TimedDespawn
    lifetime: 0.1
