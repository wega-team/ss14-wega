    - Tail

- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing, BaseToggleClothing, BaseHighlyIllegalContraband]
  id: ClothingOuterSuitSpaceNinja
  name: space ninja suit
  description: This black technologically advanced, cybernetically-enhanced suit provides many abilities like invisibility or teleportation.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/spaceninja.rsi
    layers:
    - state: icon-ninja_suit_classic_green
      map: ["enum.Content.Shared.Ninja.NinjaColorLayer.SuitBase"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Content.Shared.Ninja.NinjaColorVisuals.SuitVariant:
        enum.Content.Shared.Ninja.NinjaColorLayer.SuitBase:
          0: {state: icon-ninja_suit_classic_red}
          1: {state: icon-ninja_suit_classic_blue}
          2: {state: icon-ninja_suit_classic_green}
          3: {state: icon-ninja_suit_classic_red_f}
          4: {state: icon-ninja_suit_classic_blue_f}
          5: {state: icon-ninja_suit_classic_green_f}
          6: {state: icon-ninja_suit_new_red}
          7: {state: icon-ninja_suit_new_blue}
          8: {state: icon-ninja_suit_new_green}
          9: {state: icon-ninja_suit_new_red_f}
          10: {state: icon-ninja_suit_new_blue_f}
          11: {state: icon-ninja_suit_new_green_f}
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/spaceninja.rsi
    equippedState: equipped_ninja_suit_classic_green
  # hardsuit stuff
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
  # phase cloak — only the action button can toggle; block ContextMenu verb and hotkey
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: ToggleClothing
    action: ActionTogglePhaseCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: NinjaCloakActive
  - type: NinjaCloakHeat
  - type: PowerCellDraw
    drawRate: 1.8 # 200 seconds on the default cell
  - type: ToggleCellDraw
  # jetpack powered by suit charge
  - type: NinjaJetpack
    chargePerSecond: 10
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  # core ninja suit stuff
  - type: NinjaSuit
  - type: NinjaUraniumTank
  - type: SpiritForm
    drainRate: 0.06
    speedModifier: 0.8
  - type: EmpResistance
    strengthMultiplier: 0
  - type: UseDelay
    delay: 5 # disable time
  - type: PowerCellSlot
    cellSlotId: cell_slot
    # throwing in a recharger would bypass glove charging mechanic
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        disableEject: true
        whitelist:
          tags:
            - PowerCell
  - type: HideLayerClothing
    slots:
    - Tail
  - type: SpiderOS
  - type: ActivatableUI
    key: enum.SpiderOSUiKey.Key
    verbOnly: true
  - type: UserInterface
    interfaces:
      enum.SpiderOSUiKey.Key:
        type: SpiderOSBui

