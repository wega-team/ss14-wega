- type: entity
  id: FloorLiquidPlasmaEntity
  name: liquid phoron
  description: Sweet, expensive nectar. Don't consume.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TileEmission
    color: "#c906f3"
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Flammable
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
    # Corvax-Wega-Vehicles-start
    - !type:EntityDamage
      requiredComponent: Vehicle
      blacklistedComponent: Boat
      damageType: Blunt
      amount: 500
    # Corvax-Wega-Vehicles-end
  # Corvax-Wega-Lavaland-start
    blacklist:
      components:
      - LavaWalking
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.4
    sprintSpeedModifier: 0.4
  # Corvax-Wega-Lavaland-end
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/TileEntities/liquid-phoron.rsi
    drawdepth: BelowFloor
  - type: Icon
    sprite: Tiles/TileEntities/liquid-phoron.rsi
    state: full
  - type: IconSmooth
    key: phoron
    base: water
    additionalKeys:
    - walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Tag
    tags:
    - HideContextMenu
    - CanSwim # Corvax-Wega-Lavaland
  - type: PlacementReplacement
    key: tileOverlay
