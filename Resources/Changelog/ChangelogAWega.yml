- author: Zekins3366
  changes:
  - message: 'Любые синтетики не могут стать культистом крови и вампиром, также андроида нельзя конвертировать в тралла вампира,вампиры не могут пить кровь, использование инструментов аналогичного типа как сварочный аппарат теперь активирует его при начале шага операции,потеря ноги теперь точно переведет персонажа в лежачее положение,персонажи без обеих ног теперь могут ползать,синтетики теперь могут жить без головы, в случае её потери

      Добавлены действия к хирургическим шагам операции для синтетиков,начать операцию синтетику можно в любом положении, в любое время, с помощью отвертки (открыть хирургическое меню), андроид больше не может пассивно останавливать кровотечение, остановить кровотек теперь можно с помощью кабеля или ударом сваркой.'
    type: Add
