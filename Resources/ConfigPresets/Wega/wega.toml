[game]
hostname = "🌟 Corvax — Вега 🌟[TTS][18+]"
desc = "Корвакс — первый русскоязычный проект в Space Station 14.\nВега — первый официальный ЕРП сервер от Корвакс, где ЕРП — это не обязательный элемент, а опция для тех, кто хочет добавить глубины в свою игру.\nНа Вега внедрён TTS (Text-to-Speech), чтобы сделать общение более живым и атмосферным."
map_pool = "WegaDefaultMapPool"
secret_weight_prototype = "WegaSecretDefault"
defaultpreset = "Extended"
fallbackpreset = "Extended"
maxplayers = 180
soft_max_players = 100
lobbyduration = 360
map_rotation = false

[lobby]
server_hub_enabled = true

[events]
enabled = true

[wega]
respawn_enabled = true
barks_enabled = true
night_light_enabled = true
roundend_vote_enabled = true
sound_insulation_enabled = true

[npc]
