name: "Labels: Approve"

on:
  pull_request_review:
    types: [submitted]

jobs:
  remove_label:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-remove-labels@v1
      with:
        github_token: ${{ secrets.LABELER_PAT }}
        labels: |
          S: Needs Review
          S: Awaiting Changes
